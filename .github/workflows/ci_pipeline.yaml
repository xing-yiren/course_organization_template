          python3 -c '
import json
import subprocess
import sys
import multiprocessing
import os
from pathlib import Path

# Load file list
with open(".ci-cache/pylint-files.json", "r", encoding="utf-8") as f:
    files_data = json.load(f)

ipynb_files = files_data.get("ipynb", [])
if not ipynb_files:
    print("No notebook files to lint")
    sys.exit(0)

print(f"🔧 Running Pylint on {len(ipynb_files)} modified .ipynb files...")
print("Files to lint:")
valid_files = []
invalid_files = []

# Validate each notebook
for file in ipynb_files:
    print(f"  - {file}")
    try:
        with open(file, "r", encoding="utf-8") as f:
            json.load(f)
        valid_files.append(file)
    except Exception as e:
        print(f"    ⚠️ Invalid notebook: {e}")
        invalid_files.append(file)

# Save invalid files list
if invalid_files:
    with open("pylint_results/invalid_notebooks.txt", "w", encoding="utf-8") as f:
        for file in invalid_files:
            f.write(f"{file}\n")

if not valid_files:
    print("❌ No valid notebook files to lint")
    with open("pylint_results/pylint_ipynb_exit_code.txt", "w") as f:
        f.write("255")
    sys.exit(0)

# Create file list for nbqa
list_file = "nbqa_files.txt"
with open(list_file, "w", encoding="utf-8") as f:
    for file in valid_files:
        f.write(f"{file}\n")

# Run nbqa pylint
num_cores = multiprocessing.cpu_count()
cmd = ["nbqa", "pylint", f"--jobs={num_cores}", "--rcfile=.github/pylint.conf"]

# Add files from list
with open(list_file, "r", encoding="utf-8") as f:
    for line in f:
        file = line.strip()
        if file:
            cmd.append(file)

try:
    result = subprocess.run(cmd, capture_output=True, text=True)
    output = result.stdout + result.stderr
    
    # Save output
    with open("pylint_results/pylint_ipynb_logs.txt", "w", encoding="utf-8") as f:
        f.write(output)
    
    # Print output
    print(output)
    
    # Parse results
    error_count = output.count("E:") + output.count("F:")
    warning_count = output.count("W:")
    
    print(f"\n📊 nbqa Pylint Statistics:")
    print(f"  Errors: {error_count}")
    print(f"  Warnings: {warning_count}")
    
    # Save exit code and stats
    with open("pylint_results/pylint_ipynb_exit_code.txt", "w") as f:
        f.write(str(result.returncode))
    
    with open("pylint_results/pylint_ipynb_stats.txt", "w") as f:
        f.write(f"ERROR_COUNT={error_count}\n")
        f.write(f"WARNING_COUNT={warning_count}\n")
        f.write(f"INVALID_COUNT={len(invalid_files)}\n")
    
    if result.returncode == 0:
        print("✅ .ipynb files Pylint check passed")
    else:
        print(f"❌ .ipynb files Pylint check failed (exit code: {result.returncode})")
    
    # Cleanup
    os.remove(list_file)
    
except Exception as e:
    print(f"Error running nbqa pylint: {e}")
    with open("pylint_results/pylint_ipynb_exit_code.txt", "w") as f:
        f.write("1")
