# This is a workflow for Pylint check.

name: CI Pipeline

# Controls when the workflow will run
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  pylint-check:
    name: Pylint Check
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 防止长时间运行
    
    # 添加重试机制的环境变量
    env:
      RETRY_COUNT: 3
      RETRY_DELAY: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史用于文件比较

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"

      - name: Install dependencies
        run: |
          # 升级 pip
          python -m pip install --upgrade pip==24.0
          
          # 安装 PyTorch (CPU版本)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
          # 安装 requirements.txt 中的依赖
          if [ -f "requirements.txt" ]; then 
            echo "📦 Installing dependencies from requirements.txt..."
            pip install -r requirements.txt
          fi
          
          # 检查并安装 pylint（如果未安装）
          if ! command -v pylint &> /dev/null; then
            echo "📦 Pylint not found, installing..."
            pip install pylint
            echo "✅ Pylint installation completed: $(pylint --version | head -n 1)"
          else
            echo "✅ Pylint is already installed: $(pylint --version | head -n 1)"
          fi

          # 检查并安装 nbqa（用于 Jupyter Notebook 检查）
          if ! command -v nbqa &> /dev/null; then
            echo "📦 nbqa not found, installing..."
            pip install nbqa
            echo "✅ nbqa installation completed: $(nbqa --version 2>/dev/null || echo 'installed')"
          else
            echo "✅ nbqa is already installed"
          fi
        shell: bash

      # ==================== 增强的文件检测模块 ====================
      - name: Get Modified .py/.ipynb Files (Enhanced)
        id: get_modified_files
        run: |
          set -euo pipefail
          
          # 初始化变量
          VALID_CHANGED_PY=""
          VALID_CHANGED_IPYNB=""
          ALL_CHANGED_FILES=""
          DELETED_FILES=""
          ERROR_LOG="file_detection_errors.log"
          
          # 创建临时目录
          TMP_DIR=$(mktemp -d)
          trap "rm -rf $TMP_DIR" EXIT
          
          # 获取改动文件的函数（统一方法）
          get_changed_files() {
            local files=""
            
            # 检查是否是PR事件
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "🔍 PR Mode: Using git diff with PR base"
              
              # 获取PR的基础commit
              if [ -n "${{ github.event.pull_request.base.sha }}" ] && [ -n "${{ github.event.pull_request.head.sha }}" ]; then
                BASE_SHA="${{ github.event.pull_request.base.sha }}"
                HEAD_SHA="${{ github.event.pull_request.head.sha }}"
                files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --diff-filter=ACMRT 2>/dev/null || echo "")
              fi
              
              # 如果git diff失败，尝试使用GitHub API（带重试）
              if [ -z "$files" ]; then
                echo "⚠️ Git diff failed, trying GitHub API with retry..."
                
                # 带重试的API调用
                for i in $(seq 1 ${{ env.RETRY_COUNT }}); do
                  echo "Attempt $i of ${{ env.RETRY_COUNT }}..."
                  
                  # 调用API获取PR改动文件
                  # 定义curl参数数组
                  CURL_ARGS=(
                    -s
                    -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
                    -H "Accept: application/vnd.github+json"
                    -H "X-GitHub-Api-Version: 2022-11-28"
                    "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
                  )
            
                  # 执行curl
                  API_RESPONSE=$(curl "${CURL_ARGS[@]}")
                  
                  # 检查是否限流
                  if echo "$API_RESPONSE" | grep -q "API rate limit"; then
                    echo "⚠️ API rate limit hit, waiting ${{ env.RETRY_DELAY }} seconds..."
                    sleep ${{ env.RETRY_DELAY }}
                    continue
                  fi
                  
                  # 解析响应
                  files=$(echo "$API_RESPONSE" | jq -r '.[] | select(.status != "removed") | .filename' 2>/dev/null || echo "")
                  
                  if [ -n "$files" ]; then
                    echo "✅ Successfully got files from API"
                    break
                  fi
                done
              fi
            else
              # Push场景
              echo "🔍 Push Mode: Using git diff"
              
              # 检查是否有父commit
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                # 有父commit
                if git merge-base HEAD HEAD^ >/dev/null 2>&1; then
                  # 正常情况
                  files=$(git diff --name-only HEAD^ HEAD --diff-filter=ACMRT 2>/dev/null || echo "")
                else
                  # Merge commit
                  files=$(git diff --name-only HEAD~1 HEAD --diff-filter=ACMRT 2>/dev/null || echo "")
                fi
              else
                # 首次提交
                echo "🎉 First commit detected"
                
                # 方法1: 使用git show
                files=$(git show --name-only --format=format:'' HEAD 2>/dev/null | grep -v '^$' || echo "")
                
                # 方法2: 如果上面失败，使用git ls-files（但只包括本次提交的）
                if [ -z "$files" ]; then
                  # 获取首次提交的树对象
                  TREE_HASH=$(git rev-parse HEAD^{tree})
                  files=$(git ls-tree -r --name-only "$TREE_HASH" 2>/dev/null || echo "")
                fi
                
                # 方法3: 最后兜底，列出所有文件
                if [ -z "$files" ]; then
                  echo "⚠️ Falling back to listing all files"
                  files=$(find . -type f -not -path "./.git/*" -printf '%P\n' 2>/dev/null || echo "")
                fi
              fi
            fi
            
            echo "$files"
          }
          
          # 获取改动文件
          ALL_CHANGED_FILES=$(get_changed_files)
          
          # 验证文件存在性和可读性
          validate_file() {
            local file="$1"
            
            # 检查文件是否存在
            if [ ! -e "$file" ]; then
              echo "DELETED: $file" >> "$ERROR_LOG"
              return 1
            fi
            
            # 检查是否是符号链接且目标存在
            if [ -L "$file" ] && [ ! -e "$(readlink "$file")" ]; then
              echo "BROKEN_SYMLINK: $file" >> "$ERROR_LOG"
              return 1
            fi
            
            # 检查文件是否可读
            if [ ! -r "$file" ]; then
              echo "UNREADABLE: $file" >> "$ERROR_LOG"
              return 1
            fi
            
            # 检查文件是否为空（可选）
            if [ ! -s "$file" ]; then
              echo "EMPTY: $file" >> "$ERROR_LOG"
              # 可以选择返回0以包含空文件，或返回1以排除
              return 0  # 包含空文件，让lint工具决定
            fi
            
            return 0
          }
          
          # 分类筛选文件
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            
            # 移除可能的./前缀
            file="${file#./}"
            
            # 验证文件
            if validate_file "$file"; then
              # 分类
              if [[ "$file" =~ \.py$ ]]; then
                VALID_CHANGED_PY+="$file"$'\n'
              elif [[ "$file" =~ \.ipynb$ ]]; then
                # 验证JSON格式
                if jq -e . "$file" >/dev/null 2>&1; then
                  VALID_CHANGED_IPYNB+="$file"$'\n'
                else
                  echo "INVALID_JSON: $file" >> "$ERROR_LOG"
                fi
              fi
            fi
          done <<< "$ALL_CHANGED_FILES"
          
          # 去除空行
          VALID_CHANGED_PY=$(echo "$VALID_CHANGED_PY" | sed '/^$/d')
          VALID_CHANGED_IPYNB=$(echo "$VALID_CHANGED_IPYNB" | sed '/^$/d')
          
          # 统计文件数量
          PY_FILE_COUNT=$(echo "$VALID_CHANGED_PY" | wc -l | tr -d ' ')
          IPYNB_FILE_COUNT=$(echo "$VALID_CHANGED_IPYNB" | wc -l | tr -d ' ')
          
          # 兜底：空值设为0
          PY_FILE_COUNT=${PY_FILE_COUNT:-0}
          IPYNB_FILE_COUNT=${IPYNB_FILE_COUNT:-0}
          
          # 生成安全的文件列表（处理特殊字符）
          generate_safe_file_list() {
            local file_list="$1"
            local output_var="$2"
            local list_file="$3"
            
            if [ -n "$file_list" ]; then
              # 写入文件列表（每行一个文件）
              echo "$file_list" > "$list_file"
              
              # 生成shell安全的参数字符串
              local args=""
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                # 使用printf %q进行转义
                args+=" $(printf '%q' "$file")"
              done <<< "$file_list"
              args="${args# }"  # 移除开头的空格
              
              # 导出到环境变量
              echo "$output_var=$args" >> "$GITHUB_ENV"
              echo "${output_var}_LIST=$list_file" >> "$GITHUB_ENV"
            fi
          }
          
          # 生成安全文件列表
          PY_LIST_FILE="$TMP_DIR/py_files.txt"
          IPYNB_LIST_FILE="$TMP_DIR/ipynb_files.txt"
          
          generate_safe_file_list "$VALID_CHANGED_PY" "PY_FILES_ARGS" "$PY_LIST_FILE"
          generate_safe_file_list "$VALID_CHANGED_IPYNB" "IPYNB_FILES_ARGS" "$IPYNB_LIST_FILE"
          
          # 导出文件列表路径
          echo "PY_FILES_LIST=$PY_LIST_FILE" >> "$GITHUB_ENV"
          echo "IPYNB_FILES_LIST=$IPYNB_LIST_FILE" >> "$GITHUB_ENV"
          
          # 导出计数
          echo "PY_FILE_COUNT=$PY_FILE_COUNT" >> "$GITHUB_ENV"
          echo "IPYNB_FILE_COUNT=$IPYNB_FILE_COUNT" >> "$GITHUB_ENV"
          
          # 导出错误日志
          if [ -s "$ERROR_LOG" ]; then
            echo "FILE_DETECTION_ERRORS<<EOF" >> "$GITHUB_ENV"
            cat "$ERROR_LOG" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi
          
          # 打印结果
          echo "======================================"
          echo "===== Changed Files Summary ====="
          echo "✅ Valid .py files: $PY_FILE_COUNT"
          [ -n "$VALID_CHANGED_PY" ] && echo "$VALID_CHANGED_PY" | while IFS= read -r f; do echo "  - $f"; done
          
          echo "✅ Valid .ipynb files: $IPYNB_FILE_COUNT"
          [ -n "$VALID_CHANGED_IPYNB" ] && echo "$VALID_CHANGED_IPYNB" | while IFS= read -r f; do echo "  - $f"; done
          
          if [ -s "$ERROR_LOG" ]; then
            echo "⚠️ Skipped files:"
            cat "$ERROR_LOG" | while IFS= read -r line; do echo "  - $line"; done
          fi
          echo "======================================"
        shell: bash

      # ==================== 改进的Pylint执行 ====================
      - name: Run Pylint for .py files (Enhanced)
        if: ${{ env.PY_FILE_COUNT > 0 }}
        run: |
          NUM_CORES=$(nproc)
          CHUNK_SIZE=50  # 每批处理50个文件
          
          echo "🔧 Running Pylint on ${{ env.PY_FILE_COUNT }} .py files..."
          
          # 从文件读取文件列表
          if [ -f "${{ env.PY_FILES_LIST }}" ]; then
            # 分批处理大量文件
            BATCH_NUM=1
            TOTAL_FILES=${{ env.PY_FILE_COUNT }}
            PROCESSED=0
            FAILED_BATCHES=0
            
            while [ $PROCESSED -lt $TOTAL_FILES ]; do
              # 计算当前批次的文件
              BATCH_FILES=$(tail -n +$((PROCESSED + 1)) "${{ env.PY_FILES_LIST }}" | head -n $CHUNK_SIZE)
              BATCH_COUNT=$(echo "$BATCH_FILES" | wc -l | tr -d ' ')
              
              echo -e "\n📦 Processing batch $BATCH_NUM ($BATCH_COUNT files)..."
              
              # 创建临时文件列表
              BATCH_LIST="pylint_batch_${BATCH_NUM}.txt"
              echo "$BATCH_FILES" > "$BATCH_LIST"
              
              # 执行Pylint
              set +e
              pylint --rcfile=.github/pylint.conf \
                     --jobs=$NUM_CORES \
                     --output-format=colorized \
                     $(cat "$BATCH_LIST") 2>&1 | tee -a pylint_py_logs.txt
              
              PYLINT_EXIT_CODE=${PIPESTATUS[0]}
              set -e
              
              if [ $PYLINT_EXIT_CODE -ne 0 ]; then
                echo "⚠️ Batch $BATCH_NUM failed with exit code $PYLINT_EXIT_CODE"
                FAILED_BATCHES=$((FAILED_BATCHES + 1))
                # 记录失败的批次
                echo "FAILED_BATCH: $BATCH_NUM" >> pylint_failed_batches.log
              fi
              
              PROCESSED=$((PROCESSED + BATCH_COUNT))
              BATCH_NUM=$((BATCH_NUM + 1))
              rm -f "$BATCH_LIST"
            done
            
            # 最终退出码：如果有任何批次失败，返回非0
            if [ $FAILED_BATCHES -gt 0 ]; then
              echo "❌ $FAILED_BATCHES batches failed"
              FINAL_EXIT_CODE=1
            else
              echo "✅ All batches passed"
              FINAL_EXIT_CODE=0
            fi
            
            echo "$FINAL_EXIT_CODE" > pylint_py_exit_code.txt
          else
            echo "⚠️ File list not found, skipping"
            echo "0" > pylint_py_exit_code.txt
          fi
        shell: bash
        continue-on-error: true

      # ==================== 改进的nbqa执行 ====================
      - name: Run Pylint for .ipynb files (via nbqa with enhanced error handling)
        if: ${{ env.IPYNB_FILE_COUNT > 0 }}
        run: |
          NUM_CORES=$(nproc)
          echo "🔧 Running Pylint on ${{ env.IPYNB_FILE_COUNT }} .ipynb files..."
          
          # 创建日志文件
          NBQA_OUTPUT="nbqa_output.log"
          NBQA_ERROR="nbqa_error.log"
          PYLINT_RESULTS="pylint_ipynb_results.log"
          
          # 从文件读取文件列表
          if [ -f "${{ env.IPYNB_FILES_LIST }}" ]; then
            # 逐文件处理以便更好的错误隔离
            FAILED_FILES=0
            
            while IFS= read -r notebook; do
              [ -z "$notebook" ] && continue
              
              echo -e "\n📓 Checking: $notebook"
              
              # 为每个notebook创建临时文件
              TMP_NBQA_OUT=$(mktemp)
              TMP_NBQA_ERR=$(mktemp)
              
              set +e
              # 运行nbqa并捕获所有输出
              nbqa pylint "$notebook" \
                --jobs=$NUM_CORES \
                --rcfile=.github/pylint.conf \
                2> >(tee "$TMP_NBQA_ERR" >&2) \
                | tee "$TMP_NBQA_OUT"
              
              NBQA_EXIT_CODE=${PIPESTATUS[0]}
              set -e
              
              # 增强的退出码分析
              {
                echo "=== $notebook ==="
                echo "nbqa exit code: $NBQA_EXIT_CODE"
                
                # 分析nbqa输出
                if [ -s "$TMP_NBQA_OUT" ]; then
                  if grep -q "Your code has been rated at" "$TMP_NBQA_OUT"; then
                    RATING=$(grep "Your code has been rated at" "$TMP_NBQA_OUT" | grep -oP '[0-9.]+/10')
                    echo "pylint rating: $RATING"
                  fi
                  
                  # 检查是否有pylint错误
                  if grep -q "^[^:]*:[0-9]*:[0-9]*: [CEF]" "$TMP_NBQA_OUT"; then
                    echo "pylint_errors: true"
                    cat "$TMP_NBQA_OUT" >> "$PYLINT_RESULTS"
                  fi
                fi
                
                # 检查nbqa自身错误
                if [ -s "$TMP_NBQA_ERR" ]; then
                  if grep -q "ModuleNotFoundError" "$TMP_NBQA_ERR"; then
                    echo "nbqa_error: missing_dependency"
                  elif grep -q "SyntaxError" "$TMP_NBQA_ERR"; then
                    echo "nbqa_error: syntax_error"
                  else
                    echo "nbqa_error: other"
                  fi
                  cat "$TMP_NBQA_ERR" >> "$NBQA_ERROR"
                fi
                
                echo "---"
              } >> "$NBQA_OUTPUT"
              
              # 判断是否失败
              if [ $NBQA_EXIT_CODE -ne 0 ]; then
                # 检查是否真的是pylint错误
                if [ -s "$TMP_NBQA_OUT" ] && grep -q "^[^:]*:[0-9]*:[0-9]*: [CEF]" "$TMP_NBQA_OUT"; then
                  echo "❌ Pylint found issues in $notebook"
                  FAILED_FILES=$((FAILED_FILES + 1))
                elif [ -s "$TMP_NBQA_ERR" ]; then
                  echo "⚠️ nbqa encountered an error processing $notebook"
                  # nbqa错误不计数为失败，但记录
                fi
              fi
              
              rm -f "$TMP_NBQA_OUT" "$TMP_NBQA_ERR"
            done < "${{ env.IPYNB_FILES_LIST }}"
            
            # 生成汇总报告
            {
              echo "======================================"
              echo "nbQA Pylint Summary"
              echo "======================================"
              echo "Total notebooks: ${{ env.IPYNB_FILE_COUNT }}"
              echo "Failed notebooks: $FAILED_FILES"
              echo ""
              echo "Detailed results in $PYLINT_RESULTS"
              echo "nbQA errors in $NBQA_ERROR"
            } >> "$NBQA_OUTPUT"
            
            # 保存最终状态
            if [ $FAILED_FILES -gt 0 ]; then
              echo "❌ $FAILED_FILES notebooks have pylint issues"
              echo "1" > pylint_ipynb_exit_code.txt
            else
              echo "✅ All notebooks passed pylint check"
              echo "0" > pylint_ipynb_exit_code.txt
            fi
            
            # 上传日志作为artifact
            if [ -s "$PYLINT_RESULTS" ] || [ -s "$NBQA_ERROR" ]; then
              echo "📤 Uploading logs..."
              # 这里可以添加上传artifact的步骤
            fi
          else
            echo "⚠️ File list not found, skipping"
            echo "0" > pylint_ipynb_exit_code.txt
          fi
        shell: bash
        continue-on-error: true

      # ==================== 状态设置步骤 ====================
      - name: Set Pylint .py Status
        if: ${{ env.PY_FILE_COUNT > 0 }}
        run: |
          if [ -f pylint_py_exit_code.txt ] && [ "$(cat pylint_py_exit_code.txt)" = "0" ]; then
            echo "PYLINT_PY_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "PYLINT_PY_STATUS=failed" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Skip Pylint for .py (no files)
        if: ${{ env.PY_FILE_COUNT == 0 }}
        run: |
          echo "✅ No modified .py files found, skipping Pylint for .py"
          echo "PYLINT_PY_STATUS=skipped" >> "$GITHUB_ENV"

      - name: Set Pylint .ipynb Status
        if: ${{ env.IPYNB_FILE_COUNT > 0 }}
        run: |
          if [ -f pylint_ipynb_exit_code.txt ] && [ "$(cat pylint_ipynb_exit_code.txt)" = "0" ]; then
            echo "PYLINT_IPYNB_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "PYLINT_IPYNB_STATUS=failed" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Skip Pylint for .ipynb (no files)
        if: ${{ env.IPYNB_FILE_COUNT == 0 }}
        run: |
          echo "✅ No modified .ipynb files found, skipping Pylint for .ipynb"
          echo "PYLINT_IPYNB_STATUS=skipped" >> "$GITHUB_ENV"

      # ==================== 改进的总结步骤 ====================
      - name: Summarize Pylint Check Results
        run: |
          echo "===== Pylint Check Summary ====="
          echo ".py files status: ${{ env.PYLINT_PY_STATUS }}"
          echo ".ipynb files status: ${{ env.PYLINT_IPYNB_STATUS }}"
          
          # 显示文件检测错误
          if [ -n "${{ env.FILE_DETECTION_ERRORS }}" ]; then
            echo ""
            echo "⚠️ File detection warnings:"
            echo "${{ env.FILE_DETECTION_ERRORS }}"
          fi
          
          echo "================================="
          
          # 检查失败状态
          FAILED=false
          
          if [ "${{ env.PYLINT_PY_STATUS }}" = "failed" ]; then
            echo "❌ .py files failed Pylint check. Please check the 'Run Pylint for .py files' step above for detailed errors."
            FAILED=true
          fi
          
          if [ "${{ env.PYLINT_IPYNB_STATUS }}" = "failed" ]; then
            echo "❌ .ipynb files failed Pylint check. Please check the 'Run Pylint for .ipynb files' step above for detailed errors."
            fi
            FAILED=true
          fi
          
          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "❌ Pylint check failed. Please fix the errors above."
            exit 1
          else
            echo "✅ All Pylint checks passed!"
          fi
        shell: bash

  markdownlint-check:
    name: Markdownlint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ==================== 改进的Markdown文件检测 ====================
      - name: Get Changed Markdown and Notebook Files (Enhanced)
        id: get_changed_files
        run: |
          set -euo pipefail
          
          # 初始化变量
          VALID_CHANGED_IPYNB=""
          VALID_CHANGED_MD=""
          ERROR_LOG="md_detection_errors.log"
          
          # 创建临时目录
          TMP_DIR=$(mktemp -d)
          trap "rm -rf $TMP_DIR" EXIT
          
          # 获取改动文件（复用之前的逻辑）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR场景
            if [ -n "${{ github.event.pull_request.base.sha }}" ] && [ -n "${{ github.event.pull_request.head.sha }}" ]; then
              ALL_CHANGED_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" --diff-filter=ACMRT 2>/dev/null || echo "")
            fi
          else
            # Push场景
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              ALL_CHANGED_FILES=$(git diff --name-only HEAD^ HEAD --diff-filter=ACMRT 2>/dev/null || echo "")
            else
              # 首次提交
              ALL_CHANGED_FILES=$(git show --name-only --format=format:'' HEAD 2>/dev/null | grep -v '^$' || echo "")
            fi
          fi
          
          # 文件验证函数
          validate_file() {
            local file="$1"
            
            if [ ! -f "$file" ] || [ ! -r "$file" ]; then
              return 1
            fi
            
            # 检查文件编码（对于MD文件）
            if [[ "$file" =~ \.md$ ]]; then
              if file "$file" | grep -q "XML document"; then
                # 可能是ipynb文件误判
                return 1
              fi
            fi
            
            return 0
          }
          
          # 分类筛选
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            file="${file#./}"
            
            if validate_file "$file"; then
              if [[ "$file" =~ \.ipynb$ ]]; then
                # 验证JSON
                if jq -e . "$file" >/dev/null 2>&1; then
                  VALID_CHANGED_IPYNB+="$file"$'\n'
                else
                  echo "INVALID_JSON: $file" >> "$ERROR_LOG"
                fi
              elif [[ "$file" =~ \.md$ ]]; then
                VALID_CHANGED_MD+="$file"$'\n'
              fi
            else
              echo "INVALID_FILE: $file" >> "$ERROR_LOG"
            fi
          done <<< "$ALL_CHANGED_FILES"
          
          # 去除空行
          VALID_CHANGED_IPYNB=$(echo "$VALID_CHANGED_IPYNB" | sed '/^$/d')
          VALID_CHANGED_MD=$(echo "$VALID_CHANGED_MD" | sed '/^$/d')
          
          # 统计数量
          IPYNB_COUNT=$(echo "$VALID_CHANGED_IPYNB" | wc -l | tr -d ' ')
          MD_COUNT=$(echo "$VALID_CHANGED_MD" | wc -l | tr -d ' ')
          
          IPYNB_COUNT=${IPYNB_COUNT:-0}
          MD_COUNT=${MD_COUNT:-0}
          
          # 导出环境变量
          echo "VALID_CHANGED_IPYNB<<EOF" >> "$GITHUB_ENV"
          echo "$VALID_CHANGED_IPYNB" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          
          echo "VALID_CHANGED_MD<<EOF" >> "$GITHUB_ENV"
          echo "$VALID_CHANGED_MD" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          
          echo "IPYNB_COUNT=$IPYNB_COUNT" >> "$GITHUB_ENV"
          echo "MD_COUNT=$MD_COUNT" >> "$GITHUB_ENV"
          
          # 打印结果
          echo "======================================"
          echo "===== Changed Files Summary ====="
          echo "✅ .ipynb files: $IPYNB_COUNT"
          [ -n "$VALID_CHANGED_IPYNB" ] && echo "$VALID_CHANGED_IPYNB" | while IFS= read -r f; do echo "  - $f"; done
          
          echo "✅ .md files: $MD_COUNT"
          [ -n "$VALID_CHANGED_MD" ] && echo "$VALID_CHANGED_MD" | while IFS= read -r f; do echo "  - $f"; done
          
          if [ -s "$ERROR_LOG" ]; then
            echo "⚠️ Skipped files:"
            cat "$ERROR_LOG" | while IFS= read -r line; do echo "  - $line"; done
          fi
          echo "======================================"
        shell: bash

      # ==================== 改进的Markdown提取 ====================
      - name: Extract Markdown from Notebooks (Enhanced)
        id: extract_md
        run: |
          set -euo pipefail
          
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          
          # 配置
          TARGET_DIR="./temp_md"
          MAP_FILE="./md_ipynb_mapping.log"
          ERROR_LOG="./extract_error.log"
          STATS_FILE="./extract_stats.log"
          
          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "MAP_FILE=$MAP_FILE" >> "$GITHUB_ENV"
          
          # 初始化
          mkdir -p "$TARGET_DIR"
          rm -rf "$TARGET_DIR"/* 2>/dev/null || true
          rm -f "$MAP_FILE" "$ERROR_LOG" "$STATS_FILE"
          
          # 如果没有ipynb文件，退出
          if [ -z "${{ env.VALID_CHANGED_IPYNB }}" ]; then
            echo "ℹ️ No changed .ipynb files to process"
            echo "EXTRACTED_COUNT=0" >> "$GITHUB_ENV"
            exit 0
          fi
          
          # 统计变量
          TOTAL_NOTEBOOKS=0
          EXTRACTED_NOTEBOOKS=0
          FAILED_NOTEBOOKS=0
          TOTAL_CELLS=0
          
          # 处理每个notebook
          while IFS= read -r nb_file; do
            TOTAL_NOTEBOOKS=$((TOTAL_NOTEBOOKS + 1))
            
            # 基础验证
            if [ -z "$nb_file" ] || [ ! -f "$nb_file" ] || [ ! -r "$nb_file" ]; then
              echo "ERROR: Invalid file: $nb_file" >> "$ERROR_LOG"
              FAILED_NOTEBOOKS=$((FAILED_NOTEBOOKS + 1))
              continue
            fi
            
            # 验证JSON
            if ! jq -e . "$nb_file" >/dev/null 2>&1; then
              echo "ERROR: Invalid JSON in $nb_file" >> "$ERROR_LOG"
              FAILED_NOTEBOOKS=$((FAILED_NOTEBOOKS + 1))
              continue
            fi
            
            # 生成输出路径
            nb_relpath="${nb_file#./}"
            md_file="$TARGET_DIR/${nb_relpath%.ipynb}.md"
            mkdir -p "$(dirname "$md_file")"
            
            # 提取markdown单元格
            {
              echo "# Extracted from: $nb_file"
              echo "# Generated: $(date -Iseconds)"
              echo ""
              
              # 使用jq提取markdown单元格
              jq -r '
                .cells | to_entries[] | 
                select(.value.cell_type == "markdown") |
                "<!-- CELL \(.key) -->\n" +
                (.value.source | if type == "array" then join("") else tostring end)
              ' "$nb_file" 2>> "$ERROR_LOG"
            } > "$md_file"
            
            # 检查提取结果
            if [ -s "$md_file" ]; then
              # 计算单元格数量
              CELL_COUNT=$(grep -c "<!-- CELL [0-9]\+ -->" "$md_file" || echo 0)
              TOTAL_CELLS=$((TOTAL_CELLS + CELL_COUNT))
              
              # 生成映射表
              md_line=0
              cell_idx=0
              
              while IFS= read -r line; do
                md_line=$((md_line + 1))
                
                if [[ "$line" =~ \<\!--\ CELL\ ([0-9]+)\ --\> ]]; then
                  cell_idx="${BASH_REMATCH[1]}"
                  continue
                fi
                
                echo "$nb_file,$cell_idx,$md_file,$md_line" >> "$MAP_FILE"
              done < "$md_file"
              
              echo "✅ Extracted: $nb_file → $md_file ($CELL_COUNT cells)"
              EXTRACTED_NOTEBOOKS=$((EXTRACTED_NOTEBOOKS + 1))
            else
              echo "⚠️ No markdown cells in $nb_file"
              rm -f "$md_file"
            fi
            
          done <<< "${{ env.VALID_CHANGED_IPYNB }}"
          
          # 生成统计信息
          {
            echo "EXTRACTED_NOTEBOOKS=$EXTRACTED_NOTEBOOKS"
            echo "FAILED_NOTEBOOKS=$FAILED_NOTEBOOKS"
            echo "TOTAL_CELLS=$TOTAL_CELLS"
            echo "MAP_LINES=$(wc -l < "$MAP_FILE" 2>/dev/null || echo 0)"
          } > "$STATS_FILE"
          
          # 导出统计
          echo "EXTRACTED_COUNT=$EXTRACTED_NOTEBOOKS" >> "$GITHUB_ENV"
          
          # 打印结果
          echo -e "\n======================================"
          echo "===== Extraction Summary ====="
          echo "Total notebooks: $TOTAL_NOTEBOOKS"
          echo "Successfully extracted: $EXTRACTED_NOTEBOOKS"
          echo "Failed: $FAILED_NOTEBOOKS"
          echo "Total markdown cells: $TOTAL_CELLS"
          echo "Mapping entries: $(wc -l < "$MAP_FILE" 2>/dev/null || echo 0)"
          
          if [ -s "$ERROR_LOG" ]; then
            echo -e "\n❌ Errors encountered:"
            cat "$ERROR_LOG"
          fi
          echo "======================================"
        shell: bash

      # ==================== 改进的Markdownlint执行 ====================
      - name: Run markdownlint (Enhanced with better error tracing)
        if: ${{ env.IPYNB_COUNT > 0 || env.MD_COUNT > 0 }}
        run: |
          set +e
          export PYTHONUNBUFFERED=1
          export NODE_UNBUFFERED=1
          
          # 安装markdownlint
          echo "📦 Installing markdownlint-cli..."
          npm install -g markdownlint-cli@0.39.0
          
          # 构建lint路径
          LINT_PATHS=()
          MAP_FILE="./md_ipynb_mapping.log"
          LINT_LOG="markdownlint_output.log"
          PARSED_ERRORS="markdownlint_errors_parsed.log"
          
          # 添加原生markdown文件
          if [ -n "${{ env.VALID_CHANGED_MD }}" ]; then
            while IFS= read -r md_file; do
              [ -n "$md_file" ] && LINT_PATHS+=("$md_file")
            done <<< "${{ env.VALID_CHANGED_MD }}"
          fi
          
          # 添加提取的markdown文件
          if [ -d "temp_md" ] && [ -n "$(ls -A temp_md 2>/dev/null)" ]; then
            LINT_PATHS+=("temp_md/**/*.md")
          fi
          
          # 如果没有文件，退出
          if [ ${#LINT_PATHS[@]} -eq 0 ]; then
            echo "✅ No files to lint"
            exit 0
          fi
          
          echo -e "\n===== Markdownlint Check Paths ====="
          printf '  - %s\n' "${LINT_PATHS[@]}"
          echo "======================================"
          
          # 运行markdownlint
          echo "🔍 Running markdownlint..."
          markdownlint "${LINT_PATHS[@]}" --config .github/.markdownlint.json > "$LINT_LOG" 2>&1
          LINT_EXIT_CODE=$?
          
          # 解析错误并溯源
          if [ $LINT_EXIT_CODE -ne 0 ] && [ -f "$MAP_FILE" ]; then
            echo -e "\n===== Markdownlint Errors (Traced to Source) ====="
            
            # 读取映射文件到关联数组
            declare -A CELL_MAP
            declare -A FILE_CELLS
            
            while IFS=',' read -r ipynb_file cell_idx md_file md_line; do
              key="$md_file:$md_line"
              CELL_MAP["$key"]="$ipynb_file:$cell_idx"
              FILE_CELLS["$ipynb_file:$cell_idx"]="$md_file:$md_line"
            done < "$MAP_FILE"
            
            # 解析每个错误
            while IFS= read -r err_line; do
              # 跳过非错误行
              if ! [[ "$err_line" =~ ^[^:]+:[0-9]+ ]]; then
                continue
              fi
              
              # 提取错误信息
              err_base=$(echo "$err_line" | cut -d' ' -f1)
              err_msg=$(echo "$err_line" | cut -d' ' -f2-)
              
              # 提取文件和行号
              md_file=$(echo "$err_base" | rev | cut -d':' -f2- | rev)
              line_num=$(echo "$err_base" | rev | cut -d':' -f1 | rev | cut -d':' -f1)
              
              # 跳过无效行号
              if ! [[ "$line_num" =~ ^[0-9]+$ ]]; then
                continue
              fi
              
              # 获取相对路径
              md_file_rel=$(realpath --relative-to=. "$md_file" 2>/dev/null || echo "$md_file")
              
              # 溯源到原始ipynb
              source_info=""
              for ((line=line_num; line>=1; line--)); do
                key="$md_file_rel:$line"
                if [ -n "${CELL_MAP[$key]}" ]; then
                  source_info="${CELL_MAP[$key]}"
                  break
                fi
              done
              
              if [ -n "$source_info" ]; then
                ipynb_file=$(echo "$source_info" | cut -d':' -f1)
                cell_idx=$(echo "$source_info" | cut -d':' -f2)
                echo -e "❌ Error in original notebook:"
                echo -e "  File: $ipynb_file (cell $cell_idx)"
                echo -e "  Error: $err_msg"
              else
                # 检查是否是提取的文件
                if [[ "$md_file_rel" == temp_md/* ]]; then
                  original_ipynb="${md_file_rel#temp_md/}"
                  original_ipynb="${original_ipynb%.md}.ipynb"
                  echo -e "❌ Error in extracted markdown (from $original_ipynb):"
                  echo -e "  Error: $err_msg"
                  echo -e "  Hint: Check around line $line_num in the markdown cell"
                else
                  echo -e "❌ Error in original markdown file:"
                  echo -e "  File: $md_file_rel:$line_num"
                  echo -e "  Error: $err_msg"
                fi
              fi
              echo "--------------------------------------"
            done < "$LINT_LOG" > "$PARSED_ERRORS"
            
            # 显示解析后的错误
            cat "$PARSED_ERRORS"
          elif [ $LINT_EXIT_CODE -ne 0 ]; then
            # 没有映射文件，直接显示原始错误
            echo -e "\n===== Markdownlint Errors ====="
            cat "$LINT_LOG"
          else
            echo -e "\n✅ All files passed markdownlint check!"
          fi
          
          exit $LINT_EXIT_CODE
        shell: bash
        continue-on-error: false

      - name: Skip Markdownlint (no files)
        if: ${{ env.IPYNB_COUNT == 0 && env.MD_COUNT == 0 }}
        run: |
          echo "✅ No changed MD/IPYNB files, skipping markdownlint"

      # ==================== 清理步骤 ====================
      - name: Clean up temporary files
        if: ${{ always() }}
        run: |
          rm -rf temp_md
          rm -f md_ipynb_mapping.log extract_error.log markdownlint_*.log
          echo "🧹 Cleanup completed"
