# This is a workflow for Pylint and Markdownlint check.
# Version: 2.0 - Enhanced Unicode support and error handling

name: CI Pipeline

# Controls when the workflow will run
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        type: boolean
        default: false
      force_check_all:
        description: 'Force check all files (ignore changes)'
        type: boolean
        default: false

# Global environment settings for Unicode support
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  pylint-check:
    name: Pylint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add concurrency to cancel outdated runs
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pylint
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git diff
          
      - name: Setup Environment for Unicode
        run: |
          # Configure git for Unicode filenames
          git config --global core.quotepath false
          git config --global core.precomposeunicode true
          
          # Show environment info
          echo "✅ Environment configured:"
          echo "  LANG: $LANG"
          echo "  LC_ALL: $LC_ALL"
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.0
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pylint nbqa
          if [ -f "requirements.txt" ]; then 
            pip install -r requirements.txt
          fi
          
          # Verify installations
          echo "✅ Installed versions:"
          echo "  Pylint: $(pylint --version | head -1)"
          echo "  Python: $(python --version)"
        shell: bash

      - name: Debug - Show Environment
        if: ${{ github.event.inputs.debug_enabled == 'true' }}
        run: |
          echo "🔍 Debug Mode Enabled"
          echo "Event: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Force check all: ${{ github.event.inputs.force_check_all }}"
          echo "Current directory: $(pwd)"
          echo "Files in repo:"
          find . -type f -name "*.py" -o -name "*.ipynb" | head -20
        shell: bash

      - name: Get Modified Files (Enhanced Unicode Support)
        id: get_modified_files
        run: |
          # Enable strict mode but careful with IFS
          set -euo pipefail
          
          # Create temp directory for file lists
          TEMP_DIR=$(mktemp -d)
          VALID_PY_FILE="$TEMP_DIR/valid_py.txt"
          VALID_IPYNB_FILE="$TEMP_DIR/valid_ipynb.txt"
          ALL_FILES_FILE="$TEMP_DIR/all_files.txt"
          ERROR_LOG="$TEMP_DIR/errors.log"
          
          # Initialize files
          > "$VALID_PY_FILE"
          > "$VALID_IPYNB_FILE"
          > "$ALL_FILES_FILE"
          > "$ERROR_LOG"
          
          echo "🔍 Detecting changed files..."
          
          # Determine if we should force check all files
          FORCE_ALL="${{ github.event.inputs.force_check_all == 'true' }}"
          
          if [ "$FORCE_ALL" = "true" ]; then
            echo "🔧 Force check all files enabled"
            ALL_CHANGED_FILES=$(git ls-files)
          else
            # Get changed files based on event type
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "🔍 PR Mode: Getting changed files via GitHub API (with pagination)"
              
              # Install jq if needed
              if ! command -v jq &> /dev/null; then
                sudo apt update && sudo apt install jq -y
              fi
              
              # API call with pagination and retry
              MAX_RETRIES=3
              RETRY_COUNT=0
              API_SUCCESS=false
              PAGE=1
              TEMP_JSON="$TEMP_DIR/api_response.json"
              
              while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$API_SUCCESS" = "false" ]; do
                if [ $RETRY_COUNT -gt 0 ]; then
                  echo "Retry $RETRY_COUNT of $MAX_RETRIES..."
                  sleep 5
                fi
                
                PAGE=1
                > "$ALL_FILES_FILE"
                
                while true; do
                  echo "Fetching page $PAGE..."
                  
                  # Define curl arguments as an array
                  CURL_ARGS=(
                    -s
                    -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
                    -H "Accept: application/vnd.github+json"
                    -H "X-GitHub-Api-Version: 2022-11-28"
                    "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100&page=$PAGE"
                  )
                  
                  # Execute curl with arguments array
                  if ! curl "${CURL_ARGS[@]}" -o "$TEMP_JSON"; then
                    echo "❌ Failed to fetch page $PAGE" >> "$ERROR_LOG"
                    break
                  fi
                  
                  # Check if response is valid JSON
                  if ! jq empty "$TEMP_JSON" 2>/dev/null; then
                    echo "❌ Invalid JSON response" >> "$ERROR_LOG"
                    break
                  fi
                  
                  # Check if we got an error from API
                  if jq -e '.message' "$TEMP_JSON" > /dev/null 2>&1; then
                    ERROR_MSG=$(jq -r '.message' "$TEMP_JSON")
                    echo "❌ API Error: $ERROR_MSG" >> "$ERROR_LOG"
                    break
                  fi
                  
                  # Extract filenames (not removed)
                  jq -r '.[] | select(.status != "removed") | .filename' "$TEMP_JSON" >> "$ALL_FILES_FILE"
                  
                  # Check if this is the last page
                  FILE_COUNT=$(jq length "$TEMP_JSON")
                  if [ "$FILE_COUNT" -lt 100 ]; then
                    break
                  fi
                  
                  PAGE=$((PAGE + 1))
                done
                
                if [ -s "$ALL_FILES_FILE" ]; then
                  API_SUCCESS=true
                else
                  RETRY_COUNT=$((RETRY_COUNT + 1))
                fi
              done
              
              if [ "$API_SUCCESS" = "true" ]; then
                ALL_CHANGED_FILES=$(cat "$ALL_FILES_FILE")
              else
                echo "⚠️ API failed, falling back to git diff" >> "$ERROR_LOG"
                # Fallback to git diff
                if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                  ALL_CHANGED_FILES=$(git diff --name-only HEAD^ HEAD --diff-filter=ACMRT)
                else
                  ALL_CHANGED_FILES=$(git ls-files)
                fi
              fi
              
            else
              # Push mode
              echo "🔍 Push Mode: Getting changed files via git diff"
              
              # Check if this is first commit
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                ALL_CHANGED_FILES=$(git diff --name-only HEAD^ HEAD --diff-filter=ACMRT)
              else
                echo "⚠️ First commit detected, checking all files"
                ALL_CHANGED_FILES=$(git ls-files)
              fi
            fi
          fi
          
          # Process files with Python (best for Unicode handling)
          if [ -n "$ALL_CHANGED_FILES" ]; then
            # Save to temp file for Python processing
            echo "$ALL_CHANGED_FILES" > "$TEMP_DIR/raw_files.txt"
            
            # Create a Python script file and execute it (avoid YAML string issues)
            cat > "$TEMP_DIR/process_files.py" << 'PYTHON_SCRIPT'
import os
import sys
import json
from pathlib import Path

# Setup
temp_dir = os.environ.get('TEMP_DIR', '/tmp')
valid_py = []
valid_ipynb = []
errors = []
all_files = []

# Read all files
raw_file_path = os.path.join(temp_dir, 'raw_files.txt')
if os.path.exists(raw_file_path):
    with open(raw_file_path, 'r', encoding='utf-8') as f:
        all_files = [line.strip() for line in f if line.strip()]

print(f"Processing {len(all_files)} files...")

for file_path in all_files:
    # Clean path
    file_path = file_path.strip().rstrip('\r')
    if not file_path:
        continue
    
    # Check if file exists (might have been deleted)
    if not os.path.exists(file_path):
        errors.append(f"File does not exist (deleted?): {file_path}")
        continue
    
    # Check if file is empty
    if os.path.getsize(file_path) == 0:
        errors.append(f"Empty file skipped: {file_path}")
        continue
    
    # Get file extension (case insensitive)
    ext = Path(file_path).suffix.lower()
    
    if ext == '.py':
        valid_py.append(file_path)
    elif ext == '.ipynb':
        # Validate notebook JSON
        try:
            with open(file_path, 'r', encoding='utf-8') as f:
                json.load(f)
            valid_ipynb.append(file_path)
        except json.JSONDecodeError as e:
            errors.append(f"Invalid notebook JSON - {file_path}: {str(e)}")
        except Exception as e:
            errors.append(f"Error reading notebook - {file_path}: {str(e)}")
    # Other file types are ignored

# Save results
py_file_path = os.path.join(temp_dir, 'valid_py.txt')
ipynb_file_path = os.path.join(temp_dir, 'valid_ipynb.txt')
error_file_path = os.path.join(temp_dir, 'errors.log')

with open(py_file_path, 'w', encoding='utf-8') as f:
    f.write('\n'.join(valid_py))

with open(ipynb_file_path, 'w', encoding='utf-8') as f:
    f.write('\n'.join(valid_ipynb))

with open(error_file_path, 'w', encoding='utf-8') as f:
    f.write('\n'.join(errors))

# Also create JSON file with all info (for later steps)
files_json = {
    'py': valid_py,
    'ipynb': valid_ipynb,
    'errors': errors
}

json_path = os.path.join(temp_dir, 'files.json')
with open(json_path, 'w', encoding='utf-8') as f:
    json.dump(files_json, f, ensure_ascii=False, indent=2)

# Print summary
print(f"\nFound {len(valid_py)} Python files, {len(valid_ipynb)} notebook files")
if errors:
    print(f"Warnings/Errors: {len(errors)}")
PYTHON_SCRIPT

            # Execute the Python script
            python3 "$TEMP_DIR/process_files.py"
          fi
          
          # Read results from Python
          if [ -f "$TEMP_DIR/valid_py.txt" ]; then
            VALID_CHANGED_PY=$(cat "$TEMP_DIR/valid_py.txt")
          fi
          
          if [ -f "$TEMP_DIR/valid_ipynb.txt" ]; then
            VALID_CHANGED_IPYNB=$(cat "$TEMP_DIR/valid_ipynb.txt")
          fi
          
          if [ -f "$TEMP_DIR/errors.log" ] && [ -s "$TEMP_DIR/errors.log" ]; then
            ERRORS=$(cat "$TEMP_DIR/errors.log")
          fi
          
          # Save to GitHub environment using heredoc (safe for Unicode)
          {
            echo "VALID_CHANGED_PY<<EOF_PY"
            echo "$VALID_CHANGED_PY"
            echo "EOF_PY"
            
            echo "VALID_CHANGED_IPYNB<<EOF_IPYNB"
            echo "$VALID_CHANGED_IPYNB"
            echo "EOF_IPYNB"
          } >> "$GITHUB_ENV"

          if [ -n "$ERRORS" ]; then
            {
              echo "FILE_DETECTION_ERRORS<<EOF_ERR"
              echo "$ERRORS"
              echo "EOF_ERR"
            } >> "$GITHUB_ENV"
          fi
          
          # Count files
          PY_FILE_COUNT=$(echo "$VALID_CHANGED_PY" | grep -c '^' || echo "0")
          IPYNB_FILE_COUNT=$(echo "$VALID_CHANGED_IPYNB" | grep -c '^' || echo "0")
          
          echo "PY_FILE_COUNT=$PY_FILE_COUNT" >> "$GITHUB_ENV"
          echo "IPYNB_FILE_COUNT=$IPYNB_FILE_COUNT" >> "$GITHUB_ENV"
          
          # Create a JSON file for later steps (safe for Unicode)
          mkdir -p .ci-cache
          if [ -f "$TEMP_DIR/files.json" ]; then
            cp "$TEMP_DIR/files.json" .ci-cache/pylint-files.json
          else
            echo '{"py":[],"ipynb":[],"errors":[]}' > .ci-cache/pylint-files.json
          fi
          
          # Print summary
          echo "======================================"
          echo "===== Changed Files Summary ====="
          echo "✅ Changed .py files (to lint):"
          if [ -z "$VALID_CHANGED_PY" ]; then
            echo "  - None"
          else
            echo "$VALID_CHANGED_PY" | while IFS= read -r f; do 
              if [ -n "$f" ]; then
                echo "  - $f"
              fi
            done
          fi
          
          echo "✅ Changed .ipynb files (to lint):"
          if [ -z "$VALID_CHANGED_IPYNB" ]; then
            echo "  - None"
          else
            echo "$VALID_CHANGED_IPYNB" | while IFS= read -r f; do 
              if [ -n "$f" ]; then
                echo "  - $f"
              fi
            done
          fi
          
          if [ -n "$ERRORS" ]; then
            echo "⚠️ Warnings/Errors:"
            echo "$ERRORS" | while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "  - $line"
              fi
            done
          fi
          echo "======================================"
          
          # Cleanup
          rm -rf "$TEMP_DIR"
        shell: bash
