  # Final status check job
  final-status:
    name: Final Status
    runs-on: ubuntu-latest
    needs: [pylint-check, markdownlint-check]
    if: ${{ always() }}
    steps:
      - name: Check all jobs status
        run: |
          echo "======================================"
          echo "===== CI Pipeline Final Status ====="
          echo "Pylint Check: ${{ needs.pylint-check.result }}"
          echo "Markdownlint Check: ${{ needs.markdownlint-check.result }}"
          echo "======================================"
          
          if [ "${{ needs.pylint-check.result }}" = "failure" ] || [ "${{ needs.pylint-check.result }}" = "cancelled" ] || \
             [ "${{ needs.markdownlint-check.result }}" = "failure" ] || [ "${{ needs.markdownlint-check.result }}" = "cancelled" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          else
            echo "✅ CI Pipeline passed"
          fi
        shell: bash
