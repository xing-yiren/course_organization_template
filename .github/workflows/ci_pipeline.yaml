          python3 -c '
import json
import subprocess
import sys
import os
from pathlib import Path

# Load file list
with open(".ci-cache/markdown-files.json", "r", encoding="utf-8") as f:
    files_data = json.load(f)

md_files = files_data.get("md", [])
extracted_files = []

# Add extracted markdown files
target_dir = os.environ.get("TARGET_DIR", "./temp_md")
if os.path.exists(target_dir):
    for md_file in Path(target_dir).rglob("*.md"):
        extracted_files.append(str(md_file))

all_files = md_files + extracted_files

if not all_files:
    print("No files to lint")
    sys.exit(0)

print(f"\n===== Markdownlint Check Files =====")
for f in all_files:
    print(f"  - {f}")
print("======================================")

# Create file list for markdownlint
list_file = "markdownlint_files.txt"
with open(list_file, "w", encoding="utf-8") as f:
    for file in all_files:
        if os.path.exists(file) and os.path.getsize(file) > 0:
            f.write(f"{file}\n")

# Run markdownlint
config_file = ".github/.markdownlint.json"
if not os.path.exists(config_file):
    config_file = ""

cmd = ["markdownlint"]
if config_file:
    cmd.extend(["--config", config_file])

# Add files from list
with open(list_file, "r", encoding="utf-8") as f:
    for line in f:
        file = line.strip()
        if file:
            cmd.append(file)

try:
    result = subprocess.run(cmd, capture_output=True, text=True)
    output = result.stdout + result.stderr
    
    # Save raw output
    with open("markdownlint_raw.log", "w", encoding="utf-8") as f:
        f.write(output)
    
    if result.returncode == 0:
        print("\n✅ All files passed markdownlint check!")
        sys.exit(0)
    
    # Parse errors and trace to original notebooks
    print("\n===== Markdownlint Errors (Traced to Source) =====")
    
    error_lines = output.split("\n")
    map_file = os.environ.get("MAP_FILE", "./md_ipynb_mapping.log")
    
    for line in error_lines:
        if not line or ":" not in line:
            continue
        
        # Parse error line (format: file:line: error)
        parts = line.split(":", 2)
        if len(parts) < 3:
            continue
        
        err_file = parts[0].strip()
        err_line = parts[1].strip()
        err_msg = parts[2].strip()
        
        # Check if this is an extracted file
        if target_dir in err_file and os.path.exists(map_file):
            # Try to find original notebook
            with open(map_file, "r", encoding="utf-8") as f:
                found = False
                for map_line in f:
                    map_parts = map_line.strip().split(",", 3)
                    if len(map_parts) >= 4:
                        nb_file = map_parts[0].replace("\\,", ",")
                        cell_idx = map_parts[1]
                        md_file = map_parts[2]
                        md_line = map_parts[3]
                        
                        if md_file == err_file and md_line == err_line:
                            print(f"\n❌ Error in notebook:")
                            print(f"  Original: {nb_file} (cell ~{cell_idx})")
                            print(f"  Location: {err_file}:{err_line}")
                            print(f"  Message: {err_msg}")
                            found = True
                            break
                if not found:
                    print(f"\n❌ Error in extracted markdown (no mapping):")
                    print(f"  File: {err_file}:{err_line}")
                    print(f"  Message: {err_msg}")
        else:
            # Native markdown file
            print(f"\n❌ Error in markdown file:")
            print(f"  File: {err_file}:{err_line}")
            print(f"  Message: {err_msg}")
    
    sys.exit(result.returncode)
    
except Exception as e:
    print(f"Error running markdownlint: {e}")
    sys.exit(1)
'
        shell: bash
        continue-on-error: false

      - name: Skip Markdownlint (no files)
