name: CI Pipeline (Robust Version)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  LC_CTYPE: en_US.UTF-8
  PIP_VERSION: "24.0"
  MARKDOWNLINT_CLI_VERSION: "0.39.0"
  PYLINT_VERSION: "3.2.2"
  NBQA_VERSION: "1.8.6"

jobs:
  pylint-check:
    name: Pylint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (Locked Versions)
        run: |
          python -m pip install --upgrade pip==${{ env.PIP_VERSION }}
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pylint==${{ env.PYLINT_VERSION }} nbqa==${{ env.NBQA_VERSION }}
          if [ -f "requirements.txt" ]; then 
            pip install -r requirements.txt 
          fi
        shell: bash

      - name: Get Modified .py/.ipynb Files (Robust)
        id: get_modified_files
        run: |
          set -euo pipefail

          declare -a VALID_CHANGED_PY=()
          declare -a VALID_CHANGED_IPYNB=()
          ALL_CHANGED_FILES=""

          if ! command -v jq &> /dev/null; then
            sudo apt update -y && sudo apt install jq -y || { echo "❌ Failed to install jq"; exit 1; }
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 PR Mode: Get changed files via GitHub API (with retry)"
            # ========== 核心修改1：curl 参数数组化 ==========
            # 定义 curl 参数数组（避免字符串拼接，兼容特殊字符）
            declare -a CURL_ARGS=(
              -s
              --retry 3
              --retry-delay 2
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28"
              "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
            )
            # 执行 curl（数组传参）
            ALL_CHANGED_FILES=$(curl "${CURL_ARGS[@]}" | jq -r '.[] | select(.status != "removed") | .filename' || echo "")
          else
            echo "🔍 Push Mode: Get changed files via git diff"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              ALL_CHANGED_FILES=$(git diff --name-only HEAD^ HEAD --diff-filter=ACMRT)
            else
              ALL_CHANGED_FILES=$(git ls-files)
            fi
          fi

          while IFS= read -r file; do
            if [ -z "$file" ] || [ ! -f "$file" ] || [ ! -s "$file" ]; then
              continue
            fi
            if [[ "$file" =~ [\n\r\"\'\\] ]]; then
              echo "⚠️ Skip file with invalid characters: $file"
              continue
            fi
            if [[ "$file" =~ \.py$ ]]; then
              VALID_CHANGED_PY+=("$file")
            elif [[ "$file" =~ \.ipynb$ ]]; then
              VALID_CHANGED_IPYNB+=("$file")
            fi
          done <<< "$ALL_CHANGED_FILES"

          echo "VALID_CHANGED_PY<<EOF" >> "$GITHUB_ENV"
          printf "%s\n" "${VALID_CHANGED_PY[@]}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          echo "VALID_CHANGED_IPYNB<<EOF" >> "$GITHUB_ENV"
          printf "%s\n" "${VALID_CHANGED_IPYNB[@]}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          PY_FILE_COUNT=${#VALID_CHANGED_PY[@]}
          IPYNB_FILE_COUNT=${#VALID_CHANGED_IPYNB[@]}

          echo "PY_FILE_COUNT=$PY_FILE_COUNT" >> "$GITHUB_ENV"
          echo "IPYNB_FILE_COUNT=$IPYNB_FILE_COUNT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "===== Changed Files Summary ====="
          echo "✅  Changed .py files (to lint):"
          if [ $PY_FILE_COUNT -eq 0 ]; then
            echo "  - None"
          else
            for f in "${VALID_CHANGED_PY[@]}"; do echo "  - $f"; done
          fi
          echo "✅  Changed .ipynb files (to lint):"
          if [ $IPYNB_FILE_COUNT -eq 0 ]; then
            echo "  - None"
          else
            for f in "${VALID_CHANGED_IPYNB[@]}"; do echo "  - $f"; done
          fi
          echo "======================================"
        shell: bash

      - name: Run Pylint for .py files (Array Args)
        if: ${{ env.PY_FILE_COUNT > 0 }}
        run: |
          NUM_CORES=$(nproc)
          echo "🔧 Running Pylint on modified .py files..."

          declare -a PY_FILES=()
          while IFS= read -r file; do
            [ -n "$file" ] && PY_FILES+=("$file")
          done <<< "${{ env.VALID_CHANGED_PY }}"

          pylint "${PY_FILES[@]}" --jobs=$NUM_CORES --rcfile=.github/pylint.conf 2>&1 | tee pylint_py_logs.txt
          PYLINT_EXIT_CODE=${PIPESTATUS[0]}

          echo "$PYLINT_EXIT_CODE" > pylint_py_exit_code.txt

          if [ $PYLINT_EXIT_CODE -eq 0 ]; then
            echo "✅ .py files Pylint check passed"
          else
            echo "❌ .py files Pylint check failed, see details in pylint_py_logs.txt"
          fi
        shell: bash
        continue-on-error: true

      - name: Set Pylint .py Status
        if: ${{ env.PY_FILE_COUNT > 0 }}
        run: |
          if [ -f pylint_py_exit_code.txt ] && [ "$(cat pylint_py_exit_code.txt)" = "0" ]; then
            echo "PYLINT_PY_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "PYLINT_PY_STATUS=failed" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Skip Pylint for .py (no files)
        if: ${{ env.PY_FILE_COUNT == 0 }}
        run: |
          echo "✅ No modified .py files found, skipping Pylint for .py"
          echo "PYLINT_PY_STATUS=skipped" >> "$GITHUB_ENV"

      - name: Run Pylint for .ipynb files (nbqa + Array Args)
        if: ${{ env.IPYNB_FILE_COUNT > 0 }}
        run: |
          NUM_CORES=$(nproc)
          echo "🔧 Running Pylint on modified .ipynb files..."

          declare -a IPYNB_FILES=()
          while IFS= read -r file; do
            [ -n "$file" ] && IPYNB_FILES+=("$file")
          done <<< "${{ env.VALID_CHANGED_IPYNB }}"

          nbqa pylint "${IPYNB_FILES[@]}" --jobs=$NUM_CORES --rcfile=.github/pylint.conf 2>&1 | tee pylint_ipynb_logs.txt
          NBQA_EXIT_CODE=${PIPESTATUS[0]}

          echo "$NBQA_EXIT_CODE" > pylint_ipynb_exit_code.txt

          if [ $NBQA_EXIT_CODE -eq 0 ]; then
            echo "✅ .ipynb files Pylint check passed"
          else
            echo "❌ .ipynb files Pylint check failed, see details in pylint_ipynb_logs.txt"
          fi
        shell: bash
        continue-on-error: true

      - name: Set Pylint .ipynb Status
        if: ${{ env.IPYNB_FILE_COUNT > 0 }}
        run: |
          if [ -f pylint_ipynb_exit_code.txt ] && [ "$(cat pylint_ipynb_exit_code.txt)" = "0" ]; then
            echo "PYLINT_IPYNB_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "PYLINT_IPYNB_STATUS=failed" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Skip Pylint for .ipynb (no files)
        if: ${{ env.IPYNB_FILE_COUNT == 0 }}
        run: |
          echo "✅ No modified .ipynb files found, skipping Pylint for .ipynb"
          echo "PYLINT_IPYNB_STATUS=skipped" >> "$GITHUB_ENV"

      - name: Summarize Pylint Check Results
        run: |
          echo "===== Pylint Check Summary ====="
          echo ".py files status: ${{ env.PYLINT_PY_STATUS }}"
          echo ".ipynb files status: ${{ env.PYLINT_IPYNB_STATUS }}"
          echo "================================="
          
          FAIL=0
          if [ "${{ env.PYLINT_PY_STATUS }}" = "failed" ]; then
            echo "❌ .py files failed Pylint check. Please check the 'Run Pylint for .py files' step above for detailed errors."
            FAIL=1
          fi
          
          if [ "${{ env.PYLINT_IPYNB_STATUS }}" = "failed" ]; then
            echo "❌ .ipynb files failed Pylint check. Please check the 'Run Pylint for .ipynb files' step above for detailed errors."
            FAIL=1
          fi
          
          if [ $FAIL -eq 1 ]; then
            echo "❌ Pylint check has failed items, CI terminated. Fix the errors above and try again."
            exit 1
          fi
        shell: bash

  markdownlint-check:
    name: Markdownlint Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get PR changed .ipynb and .md files (Robust)
        id: get_pr_changed_files
        run: |
          set -euo pipefail

          declare -a VALID_CHANGED_IPYNB=()
          declare -a VALID_CHANGED_MD=()
          ALL_CHANGED_FILES=""

          if ! command -v jq &> /dev/null; then
            sudo apt update -y && sudo apt install jq -y || { echo "❌ Failed to install jq"; exit 1; }
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 PR Mode: Get changed files via GitHub API (with retry)"
            # ========== 核心修改2：markdownlint 环节的 curl 也改成参数数组 ==========
            declare -a CURL_ARGS=(
              -s
              --retry 3
              --retry-delay 2
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28"
              "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
            )
            ALL_CHANGED_FILES=$(curl "${CURL_ARGS[@]}" | jq -r '.[] | select(.status != "removed") | .filename' || echo "")
          else
            echo "🔍 Push Mode: Get changed files via git diff"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              ALL_CHANGED_FILES=$(git diff --name-only HEAD^ HEAD --diff-filter=ACMRT)
            else
              ALL_CHANGED_FILES=$(git ls-files)
            fi
          fi

          while IFS= read -r file; do
            if [ -z "$file" ] || [ ! -f "$file" ] || [ ! -s "$file" ]; then
              continue
            fi
            if [[ "$file" =~ [\n\r\"\'\\] ]]; then
              echo "⚠️ Skip file with invalid characters: $file"
              continue
            fi
            if [[ "$file" =~ \.ipynb$ ]]; then
              VALID_CHANGED_IPYNB+=("$file")
            elif [[ "$file" =~ \.md$ ]]; then
              VALID_CHANGED_MD+=("$file")
            fi
          done <<< "$ALL_CHANGED_FILES"

          echo "VALID_CHANGED_IPYNB<<EOF" >> "$GITHUB_ENV"
          printf "%s\n" "${VALID_CHANGED_IPYNB[@]}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          echo "VALID_CHANGED_MD<<EOF" >> "$GITHUB_ENV"
          printf "%s\n" "${VALID_CHANGED_MD[@]}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          echo "======================================"
          echo "===== PR Changed Files Summary ====="
          echo "✅  Changed .ipynb files (to extract):"
          if [ ${#VALID_CHANGED_IPYNB[@]} -eq 0 ]; then
            echo "  - None"
          else
            for f in "${VALID_CHANGED_IPYNB[@]}"; do echo "  - $f"; done
          fi
          echo "✅  Changed .md files (to lint directly):"
          if [ ${#VALID_CHANGED_MD[@]} -eq 0 ]; then
            echo "  - None"
          else
            for f in "${VALID_CHANGED_MD[@]}"; do echo "  - $f"; done
          fi
          echo "======================================"
        shell: bash

      - name: Extract Markdown from PR changed .ipynb files (Robust)
        id: extract_md
        run: |
          set -euo pipefail

          TARGET_DIR="./temp_md"
          MAP_FILE="./md_ipynb_mapping.log"
          ERROR_LOG="./extract_error.log"

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "MAP_FILE=$MAP_FILE" >> "$GITHUB_ENV"

          mkdir -p "$TARGET_DIR" || { echo "❌ Failed to create $TARGET_DIR"; exit 1; }
          if [ ! -w "$TARGET_DIR" ]; then
            echo "❌ $TARGET_DIR is not writable"; exit 1;
          fi
          rm -rf "$TARGET_DIR"/* || true
          rm -f "$MAP_FILE" "$ERROR_LOG" || true

          if [ ${#VALID_CHANGED_IPYNB[@]} -eq 0 ]; then
            echo "ℹ️  No changed .ipynb files to process, skipping extraction"
            exit 0
          fi

          for nb_file in "${VALID_CHANGED_IPYNB[@]}"; do
            if [ -z "$nb_file" ] || [ ! -f "$nb_file" ] || [ ! -s "$nb_file" ]; then
              echo "ℹ️  Skip invalid/empty file: $nb_file" >> "$ERROR_LOG"
              continue
            fi

            if ! jq . "$nb_file" > /dev/null 2>&1; then
              error_msg="JSON parse failed (corrupted file)"
              echo "❌ Skip $nb_file: $error_msg"
              echo "ERROR: $nb_file - $error_msg" >> "$ERROR_LOG"
              continue
            fi

            nb_relpath="${nb_file#./}"
            md_file="$TARGET_DIR/${nb_relpath%.ipynb}.md"
            mkdir -p "$(dirname "$md_file")" || { echo "⚠️ Skip create dir for $md_file"; continue; }
            if [ ! -w "$(dirname "$md_file")" ]; then
              echo "⚠️ $md_file directory not writable"; continue;
            fi

            markdown_content=$(jq -r '
              try (
                .cells | to_entries[] |
                select(.value.cell_type == "markdown") |
                "<!-- CELL_IDX: \(.key) -->\n" +
                (.value.source | if type == "array" then join("") else tostring end)
              ) catch ""
            ' "$nb_file" 2>> "$ERROR_LOG")
            jq_exit_code=$?

            if [ $jq_exit_code -ne 0 ] || [ -z "$markdown_content" ]; then
              error_msg="JQ extraction failed or no content (exit code: $jq_exit_code)"
              echo "❌ Skip $nb_file: $error_msg"
              echo "ERROR: $nb_file - $error_msg" >> "$ERROR_LOG"
              rm -f "$md_file"
              continue
            fi

            echo "$markdown_content" > "$md_file"
            sync "$md_file" || true

            md_line=0
            cell_idx=0
            while IFS= read -r line; do
              md_line=$((md_line + 1))
              if echo "$line" | grep -q '<!-- CELL_IDX: [0-9]\+ -->'; then
                cell_idx=$(echo "$line" | cut -d ':' -f 2 | cut -d ' ' -f 2)
                continue
              fi
              echo "$nb_file,$cell_idx,$md_file,$md_line" >> "$MAP_FILE" || true
            done < "$md_file"

            echo "✅ Extracted: $nb_file → $md_file"
          done

          echo -e "\n======================================"
          echo "===== Extraction Logs ======"
          if [ -s "$ERROR_LOG" ]; then
            echo "❌ Skipped files (errors):"
            cat "$ERROR_LOG" | sort | uniq
          else
            echo "✅ No extraction errors"
          fi
          map_line_count=0
          if [ -f "$MAP_FILE" ]; then
            map_line_count=$(wc -l < "$MAP_FILE" 2>/dev/null || echo 0)
          fi
          echo "✅ Mapping file: $MAP_FILE (lines: $map_line_count)"
          echo "======================================"
        shell: bash

      - name: Run markdownlint (Array Args + Full Tracing)
        if: ${{ env.VALID_CHANGED_IPYNB != '' || env.VALID_CHANGED_MD != '' }}
        run: |
          set +e
          export PYTHONUNBUFFERED=1
          export NODE_UNBUFFERED=1

          npm install -g markdownlint-cli@${{ env.MARKDOWNLINT_CLI_VERSION }} || { echo "❌ Failed to install markdownlint-cli"; exit 1; }

          declare -a LINT_FILES=()

          while IFS= read -r file; do
            [ -n "$file" ] && LINT_FILES+=("$file")
          done <<< "${{ env.VALID_CHANGED_MD }}"

          if [ -d "${{ env.TARGET_DIR }}" ]; then
            while IFS= read -r file; do
              [ -f "$file" ] && LINT_FILES+=("$file")
            done < <(find "${{ env.TARGET_DIR }}" -name "*.md" -type f)
          fi

          echo -e "\n===== Markdownlint Check Paths ====="
          if [ ${#LINT_FILES[@]} -eq 0 ]; then
            echo "  - None"
          else
            for path in "${LINT_FILES[@]}"; do echo "  - $path"; done
          fi
          echo "======================================"

          markdownlint "${LINT_FILES[@]}" --config .github/.markdownlint.json > markdownlint_force.log 2>&1
          LINT_EXIT_CODE=$?

          if [ $LINT_EXIT_CODE -ne 0 ]; then
            echo -e "\n===== Markdownlint Errors (Traced to IPYNB) ====="

            cat markdownlint_force.log | grep -v "^$" | grep -v "=====" | while IFS= read -r err_line; do
              if ! [[ "$err_line" =~ ^[^:]+:[0-9]+ ]]; then
                continue
              fi

              ERR_BASE=$(echo "$err_line" | cut -d' ' -f1)
              ERR_MSG=$(echo "$err_line" | cut -d' ' -f2-)

              MD_FILE="$ERR_BASE"
              while [[ "$MD_FILE" =~ :[0-9]+$ ]]; do
                MD_FILE=$(echo "$MD_FILE" | rev | cut -d':' -f2- | rev)
              done
              MD_LINE=$(echo "$ERR_BASE" | rev | cut -d':' -f1 | rev)
              if [[ "$MD_LINE" =~ :[0-9]+$ ]]; then
                MD_LINE=$(echo "$MD_LINE" | cut -d':' -f1)
              fi
              if ! [[ "$MD_LINE" =~ ^[0-9]+$ ]]; then
                continue
              fi

              if command -v realpath >/dev/null 2>&1; then
                MD_FILE_REL=$(realpath --relative-to=. "$MD_FILE" 2>/dev/null || echo "$MD_FILE")
              else
                MD_FILE_REL="$MD_FILE"
              fi

              IPYNB_FOUND="false"
              if [ -f "${{ env.MAP_FILE }}" ]; then
                ALL_MAPPINGS=$(grep -F "$MD_FILE_REL" "${{ env.MAP_FILE }}")
                if [ -n "$ALL_MAPPINGS" ]; then
                  MATCHED_MAPPING=""
                  MAX_MAPPED_LINE=0
                  while IFS= read -r mapping_line; do
                    MAP_IPYNB=$(echo "$mapping_line" | cut -d',' -f1)
                    MAP_CELL=$(echo "$mapping_line" | cut -d',' -f2)
                    MAP_MD_LINE=$(echo "$mapping_line" | cut -d',' -f4)
                    if [[ "$MAP_MD_LINE" =~ ^[0-9]+$ ]] && [ "$MAP_MD_LINE" -le "$MD_LINE" ] && [ "$MAP_MD_LINE" -gt "$MAX_MAPPED_LINE" ]; then
                      MAX_MAPPED_LINE="$MAP_MD_LINE"
                      MATCHED_MAPPING="$mapping_line"
                    fi
                  done <<< "$ALL_MAPPINGS"

                  FALLBACK_MAPPING=""
                  MIN_MAPPED_LINE=999999
                  if [ -z "$MATCHED_MAPPING" ] && [ -n "$ALL_MAPPINGS" ]; then
                    while IFS= read -r mapping_line; do
                      MAP_MD_LINE=$(echo "$mapping_line" | cut -d',' -f4)
                      if [[ "$MAP_MD_LINE" =~ ^[0-9]+$ ]] && [ "$MAP_MD_LINE" -lt "$MIN_MAPPED_LINE" ]; then
                        MIN_MAPPED_LINE="$MAP_MD_LINE"
                        FALLBACK_MAPPING="$mapping_line"
                      fi
                    done <<< "$ALL_MAPPINGS"
                  fi

                  if [ -n "$MATCHED_MAPPING" ]; then
                    IPYNB_FILE=$(echo "$MATCHED_MAPPING" | cut -d',' -f1)
                    CELL_IDX=$(echo "$MATCHED_MAPPING" | cut -d',' -f2)
                    echo -e "❌ Error in ORIGINAL IPYNB (cell approximate):"
                    echo -e "  IPYNB File: $IPYNB_FILE (cell: $CELL_IDX)"
                    echo -e "  Temp MD File: $MD_FILE_REL (line: $MD_LINE, in cell $CELL_IDX)"
                    echo -e "  Error: $ERR_MSG"
                    IPYNB_FOUND="true"
                  elif [ -n "$FALLBACK_MAPPING" ]; then
                    IPYNB_FILE=$(echo "$FALLBACK_MAPPING" | cut -d',' -f1)
                    CELL_IDX=$(echo "$FALLBACK_MAPPING" | cut -d',' -f2)
                    echo -e "❌ Error in ORIGINAL IPYNB (min line fallback):"
                    echo -e "  IPYNB File: $IPYNB_FILE (cell: $CELL_IDX)"
                    echo -e "  Temp MD File: $MD_FILE_REL (line: $MD_LINE, fallback to min mapped line $MIN_MAPPED_LINE)"
                    echo -e "  Error: $ERR_MSG"
                    IPYNB_FOUND="true"
                  fi
                fi
              fi

              if [ "$IPYNB_FOUND" = "false" ]; then
                if [[ "$MD_FILE_REL" == temp_md/* ]]; then
                  echo -e "❌ Error in Extracted MD File (no IPYNB mapping):"
                  echo -e "  MD File: $MD_FILE_REL (line: $MD_LINE)"
                  echo -e "  Error: $ERR_MSG"
                  echo -e "  Hint: Check the original IPYNB file corresponding to this MD file (path: ${MD_FILE_REL/temp_md\//})."
                else
                  echo -e "❌ Error in Native MD File:"
                  echo -e "  File: $MD_FILE_REL (line: $MD_LINE)"
                  echo -e "  Error: $ERR_MSG"
                fi
              fi
              echo -e "--------------------------------------"
            done
            exit $LINT_EXIT_CODE
          else
            echo -e "\n✅ All files passed markdownlint check!"
            exit 0
          fi
        shell: bash
        continue-on-error: false

      - name: Skip Markdownlint (no files)
        if: ${{ env.VALID_CHANGED_IPYNB == '' && env.VALID_CHANGED_MD == '' }}
        run: |
          echo "✅ No changed MD/IPYNB files, skipping markdownlint"

      - name: Clean up temporary files (Always)
        if: ${{ always() }}
        run: |
          rm -rf temp_md || true
          rm -f md_ipynb_mapping.log extract_error.log markdownlint_force.log || true
        shell: bash
