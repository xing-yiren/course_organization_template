            echo "  Errors: ${{ env.PYLINT_PY_ERRORS }}"
          fi
          
          echo "📓 Notebook files: ${{ env.IPYNB_FILE_COUNT }} | Status: ${{ env.PYLINT_IPYNB_STATUS }}"
          if [ "${{ env.PYLINT_IPYNB_ERRORS }}" != "0" ] && [ -n "${{ env.PYLINT_IPYNB_ERRORS }}" ]; then
            echo "  Errors: ${{ env.PYLINT_IPYNB_ERRORS }}"
          fi
          if [ "${{ env.PYLINT_IPYNB_INVALID }}" != "0" ] && [ -n "${{ env.PYLINT_IPYNB_INVALID }}" ]; then
            echo "  Invalid notebooks skipped: ${{ env.PYLINT_IPYNB_INVALID }}"
          fi
          
          # Show file detection errors
          if [ -n "${{ env.FILE_DETECTION_ERRORS }}" ]; then
            echo -e "\n⚠️ File Detection Warnings:"
            echo "${{ env.FILE_DETECTION_ERRORS }}" | head -5
            ERROR_COUNT=$(echo "${{ env.FILE_DETECTION_ERRORS }}" | grep -c '^' || echo "0")
            if [ $ERROR_COUNT -gt 5 ]; then
              echo "  ... and $(($ERROR_COUNT - 5)) more warnings"
            fi
          fi
          
          echo "======================================"
          
          # Determine final status
          FINAL_EXIT_CODE=0
          
          if [ "${{ env.PYLINT_PY_STATUS }}" = "failed" ]; then
            echo "❌ .py files failed Pylint check"
            FINAL_EXIT_CODE=1
          fi
          
          if [ "${{ env.PYLINT_IPYNB_STATUS }}" = "failed" ]; then
            echo "❌ .ipynb files failed Pylint check"
            FINAL_EXIT_CODE=1
          fi
          
          if [ $FINAL_EXIT_CODE -eq 0 ]; then
            echo "✅ All Pylint checks passed!"
          else
            echo "❌ Pylint check failed. Fix the errors and try again."
            exit 1
          fi
        shell: bash

      - name: Upload Pylint Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pylint-results
          path: |
            pylint_results/
            .ci-cache/pylint-files.json
          retention-days: 7

  markdownlint-check:
    name: Markdownlint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-markdown
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Setup Environment for Unicode
        run: |
          # Configure git for Unicode filenames
          git config --global core.quotepath false
          git config --global core.precomposeunicode true
          
          # Install jq
          sudo apt update && sudo apt install jq -y
        shell: bash
          
      - name: Get PR changed .ipynb and .md files
        id: get_pr_changed_files
        run: |
          set -euo pipefail
          
          TEMP_DIR=$(mktemp -d)
          VALID_IPYNB_FILE="$TEMP_DIR/valid_ipynb.txt"
          VALID_MD_FILE="$TEMP_DIR/valid_md.txt"
          ERROR_LOG="$TEMP_DIR/errors.log"
          
          > "$VALID_IPYNB_FILE"
          > "$VALID_MD_FILE"
          > "$ERROR_LOG"
          
          # Determine changed files
          FORCE_ALL="${{ github.event.inputs.force_check_all == 'true' }}"
          
          if [ "$FORCE_ALL" = "true" ]; then
            echo "🔧 Force check all files enabled"
            ALL_CHANGED_FILES=$(git ls-files)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 PR Mode: Getting changed files via GitHub API"
            
            # API call with pagination
            PAGE=1
            TEMP_JSON="$TEMP_DIR/api_response.json"
            
            while true; do
              # Define curl arguments as an array
              CURL_ARGS=(
                -s
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28"
                "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100&page=$PAGE"
              )
              
              # Execute curl with arguments array
              if ! curl "${CURL_ARGS[@]}" -o "$TEMP_JSON"; then
                echo "❌ Failed to fetch page $PAGE" >> "$ERROR_LOG"
                break
              fi
              
              if ! jq empty "$TEMP_JSON" 2>/dev/null; then
                echo "❌ Invalid JSON response" >> "$ERROR_LOG"
                break
              fi
              
              # Extract filenames (not removed)
              jq -r '.[] | select(.status != "removed") | .filename' "$TEMP_JSON" >> "$TEMP_DIR/all_files.txt"
              
              # Check if this is the last page
              FILE_COUNT=$(jq length "$TEMP_JSON")
              if [ "$FILE_COUNT" -lt 100 ]; then
                break
              fi
              
              PAGE=$((PAGE + 1))
            done
            
            if [ -f "$TEMP_DIR/all_files.txt" ]; then
              ALL_CHANGED_FILES=$(cat "$TEMP_DIR/all_files.txt")
            fi
          else
            echo "🔍 Push Mode: Getting changed files via git diff"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              ALL_CHANGED_FILES=$(git diff --name-only HEAD^ HEAD --diff-filter=ACMRT)
            else
              ALL_CHANGED_FILES=$(git ls-files)
            fi
          fi
          
          # Process files with Python for Unicode support
          if [ -n "$ALL_CHANGED_FILES" ]; then
            echo "$ALL_CHANGED_FILES" > "$TEMP_DIR/raw_files.txt"
            
            python3 -c '
import os
import json
from pathlib import Path

temp_dir = os.environ.get("TEMP_DIR", "/tmp")
valid_ipynb = []
valid_md = []
errors = []

raw_file_path = os.path.join(temp_dir, "raw_files.txt")
if os.path.exists(raw_file_path):
    with open(raw_file_path, "r", encoding="utf-8") as f:
        for line in f:
            file_path = line.strip().rstrip("\r")
            if not file_path:
                continue
            
            # Check if file exists and not empty
            if not os.path.exists(file_path):
                errors.append(f"File does not exist: {file_path}")
                continue
            
            if os.path.getsize(file_path) == 0:
                errors.append(f"Empty file skipped: {file_path}")
                continue
            
            ext = Path(file_path).suffix.lower()
            
            if ext == ".ipynb":
                # Validate notebook JSON
                try:
                    with open(file_path, "r", encoding="utf-8") as f:
                        json.load(f)
                    valid_ipynb.append(file_path)
                except Exception as e:
                    errors.append(f"Invalid notebook {file_path}: {str(e)}")
            elif ext == ".md":
                valid_md.append(file_path)

# Save results
with open(os.path.join(temp_dir, "valid_ipynb.txt"), "w", encoding="utf-8") as f:
    f.write("\n".join(valid_ipynb))

with open(os.path.join(temp_dir, "valid_md.txt"), "w", encoding="utf-8") as f:
    f.write("\n".join(valid_md))

with open(os.path.join(temp_dir, "errors.log"), "w", encoding="utf-8") as f:
    f.write("\n".join(errors))

# Create JSON file
files_json = {
    "ipynb": valid_ipynb,
    "md": valid_md,
    "errors": errors
}

with open(os.path.join(temp_dir, "markdown-files.json"), "w", encoding="utf-8") as f:
    json.dump(files_json, f, ensure_ascii=False, indent=2)

print(f"Found {len(valid_ipynb)} notebooks, {len(valid_md)} markdown files")
'
          fi
          
          # Read results
          VALID_CHANGED_IPYNB=$(cat "$VALID_IPYNB_FILE" 2>/dev/null || true)
          VALID_CHANGED_MD=$(cat "$VALID_MD_FILE" 2>/dev/null || true)
          ERRORS=$(cat "$ERROR_LOG" 2>/dev/null || true)
          
          # Save to environment
