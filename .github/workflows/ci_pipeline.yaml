            echo "VALID_CHANGED_MD<<EOF_MD"
            echo "$VALID_CHANGED_MD"
            echo "EOF_MD"
          } >> "$GITHUB_ENV"
          
          if [ -n "$ERRORS" ]; then
            {
              echo "MD_DETECTION_ERRORS<<EOF_ERR"
              echo "$ERRORS"
              echo "EOF_ERR"
            } >> "$GITHUB_ENV"
          fi
          
          # Save JSON for later steps
          mkdir -p .ci-cache
          if [ -f "$TEMP_DIR/markdown-files.json" ]; then
            cp "$TEMP_DIR/markdown-files.json" .ci-cache/markdown-files.json
          else
            echo '{"ipynb":[],"md":[],"errors":[]}' > .ci-cache/markdown-files.json
          fi
          
          # Print summary
          echo "======================================"
          echo "===== Markdown Files Summary ====="
          echo "✅ Changed .ipynb files (to extract):"
          if [ -z "$VALID_CHANGED_IPYNB" ]; then
            echo "  - None"
          else
            echo "$VALID_CHANGED_IPYNB" | while IFS= read -r f; do
              if [ -n "$f" ]; then
                echo "  - $f"
              fi
            done
          fi
          
          echo "✅ Changed .md files (to lint directly):"
          if [ -z "$VALID_CHANGED_MD" ]; then
            echo "  - None"
          else
            echo "$VALID_CHANGED_MD" | while IFS= read -r f; do
              if [ -n "$f" ]; then
                echo "  - $f"
              fi
            done
          fi
          
          if [ -n "$ERRORS" ]; then
            echo "⚠️ Warnings:"
            echo "$ERRORS" | while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "  - $line"
              fi
            done
          fi
          echo "======================================"
          
          rm -rf "$TEMP_DIR"
        shell: bash

      - name: Extract Markdown from PR changed .ipynb files
        id: extract_md
        run: |
          set -euo pipefail
          
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8

          TARGET_DIR="./temp_md"
          MAP_FILE="./md_ipynb_mapping.log"
          ERROR_LOG="./extract_error.log"
          
          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "MAP_FILE=$MAP_FILE" >> "$GITHUB_ENV"

          # Initialize
          mkdir -p "$TARGET_DIR"
          rm -rf "$TARGET_DIR"/* 2>/dev/null || true
          rm -f "$MAP_FILE" "$ERROR_LOG" 2>/dev/null || true

          # Load notebook list from JSON
          python3 -c '
import json
import os
from pathlib import Path

# Load file list
with open(".ci-cache/markdown-files.json", "r", encoding="utf-8") as f:
    files_data = json.load(f)

ipynb_files = files_data.get("ipynb", [])
if not ipynb_files:
    print("No notebooks to extract")
    print("EXTRACTED_COUNT=0")
    print("SKIPPED_COUNT=0")
    sys.exit(0)

target_dir = os.environ.get("TARGET_DIR", "./temp_md")
map_file = os.environ.get("MAP_FILE", "./md_ipynb_mapping.log")
error_log = os.environ.get("ERROR_LOG", "./extract_error.log")

extracted_count = 0
skipped_count = 0

for nb_file in ipynb_files:
    if not os.path.exists(nb_file) or os.path.getsize(nb_file) == 0:
        with open(error_log, "a", encoding="utf-8") as f:
            f.write(f"Skip invalid/empty: {nb_file}\n")
        skipped_count += 1
        continue
    
    # Validate JSON
    try:
        with open(nb_file, "r", encoding="utf-8") as f:
            notebook = json.load(f)
    except Exception as e:
        with open(error_log, "a", encoding="utf-8") as f:
            f.write(f"Invalid JSON in {nb_file}: {str(e)}\n")
        skipped_count += 1
        continue
    
    # Create safe filename for target
    # Replace problematic characters
    safe_name = Path(nb_file).stem
    for char in ["/", "\\", ":", "*", "?", '"', "<", ">", "|"]:
        safe_name = safe_name.replace(char, "_")
    
    # Keep original structure but with safe names
    rel_path = Path(nb_file)
    if rel_path.is_absolute():
        # Create relative path from repo root
        try:
            rel_path = rel_path.relative_to(Path.cwd())
        except:
            rel_path = Path(safe_name)
    
    # Build target path
    target_path = Path(target_dir) / rel_path.parent / f"{safe_name}.md"
    target_path.parent.mkdir(parents=True, exist_ok=True)
    
    # Extract markdown cells
    markdown_content = []
    cell_mapping = []
    
    for cell_idx, cell in enumerate(notebook.get("cells", [])):
        if cell.get("cell_type") == "markdown":
            source = cell.get("source", [])
            if isinstance(source, list):
                content = "".join(source)
            else:
                content = str(source)
            
            # Add cell marker
            marker = f"<!-- CELL_IDX: {cell_idx} -->"
            markdown_content.append(marker)
            markdown_content.append(content)
            
            # Record mapping (will be used later)
            start_line = len(markdown_content) - 1
            cell_mapping.append({
                "cell_idx": cell_idx,
                "start_line": start_line,
                "content": content[:50] + "..." if len(content) > 50 else content
            })
    
    if not markdown_content:
        with open(error_log, "a", encoding="utf-8") as f:
            f.write(f"No markdown content in {nb_file}\n")
        skipped_count += 1
        continue
    
    # Write markdown file
    with open(target_path, "w", encoding="utf-8") as f:
        f.write("\n".join(markdown_content))
    
    # Create mapping file (CSV format with escaping)
    with open(map_file, "a", encoding="utf-8") as f:
        line_num = 0
        for line in markdown_content:
            line_num += 1
            if line.startswith("<!-- CELL_IDX:"):
                continue
            # Escape commas in filename
            escaped_nb = nb_file.replace(",", "\\,")
            f.write(f"{escaped_nb},{cell_idx},{target_path},{line_num}\n")
    
    extracted_count += 1
    print(f"✅ Extracted: {nb_file} → {target_path}")

print(f"EXTRACTED_COUNT={extracted_count}")
print(f"SKIPPED_COUNT={skipped_count}")
'

          # Capture Python output
