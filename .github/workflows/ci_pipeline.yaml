# This is a workflow for Pylint check.

name: CI Pipeline

# Controls when the workflow will run
on:
  push:
    branches: [ "*" ]
  # pull_request:
  #   branches: [ "*" ]
  pull_request_target:
    branches: [ "*" ]
    types: [opened, synchronize, reopened] 

  # Allows you to run this workflow manually from the Actions tab
  #workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  pylint-check:
    name: Pylint Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for assign reviewers and comments

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.0
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Get Modified .py/.ipynb Files (Align with Markdownlint Logic)
        id: get_modified_files
        run: |
          set -euo pipefail

          # 1. 初始化变量（对齐markdownlint的VALID_CHANGED_XXX命名）
          VALID_CHANGED_PY=""
          VALID_CHANGED_IPYNB=""
          ALL_CHANGED_FILES=""

          # 2. 区分PR/Push场景（参考markdownlint的API+git diff双逻辑）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR场景：优先用GitHub API
            echo "🔍 PR Mode: Get changed files via GitHub API"
            # 安装jq（和markdownlint逻辑对齐）
            if ! command -v jq &> /dev/null; then
              sudo apt update && sudo apt install jq -y
            fi
            # 调用API获取PR改动文件（排除删除的）
            # 定义curl参数数组
            CURL_ARGS=(
              -s
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28"
              "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
            )
            
            # 执行curl
            ALL_CHANGED_FILES=$(curl "${CURL_ARGS[@]}" | jq -r '.[] | select(.status != "removed") | .filename')
          else
            # Push场景：用git diff
            echo "🔍 Push Mode: Get changed files via git diff"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              ALL_CHANGED_FILES=$(git diff --name-only HEAD^ HEAD --diff-filter=ACMRT)
            else
              ALL_CHANGED_FILES=$(git ls-files)  # 首次提交兜底
            fi
          fi

          # 3. 筛选改动的.py/.ipynb文件
          while IFS= read -r file; do
            # 跳过空行、已删除、空文件
            if [ -z "$file" ] || [ ! -f "$file" ] || [ ! -s "$file" ]; then
              continue
            fi
            # 分类筛选
            if [[ "$file" =~ \.py$ ]]; then
              VALID_CHANGED_PY+="$file"$'\n'
            elif [[ "$file" =~ \.ipynb$ ]]; then
              VALID_CHANGED_IPYNB+="$file"$'\n'
            fi
          done <<< "$ALL_CHANGED_FILES"

          # 4. 去除末尾空行
          VALID_CHANGED_PY=$(echo "$VALID_CHANGED_PY" | sed '/^$/d')
          VALID_CHANGED_IPYNB=$(echo "$VALID_CHANGED_IPYNB" | sed '/^$/d')

          # 5. 导出环境变量
          # 为每个文件添加单引号，正确处理空格
              PY_FILES_ARGS=""
              while IFS= read -r file; do
                if [ -n "$file" ]; then
                  PY_FILES_ARGS+=" '$file'"
                fi
              done <<< "$VALID_CHANGED_PY"
              PY_FILES_ARGS=$(echo "$PY_FILES_ARGS" | sed 's/^ //')  # 移除开头的空格
          
              IPYNB_FILES_ARGS=""
              while IFS= read -r file; do
                if [ -n "$file" ]; then
                  IPYNB_FILES_ARGS+=" '$file'"
                fi
              done <<< "$VALID_CHANGED_IPYNB"
              IPYNB_FILES_ARGS=$(echo "$IPYNB_FILES_ARGS" | sed 's/^ //')

          # 统计文件数量
          PY_FILE_COUNT=$(echo "$VALID_CHANGED_PY" | wc -l | tr -d ' ')
          IPYNB_FILE_COUNT=$(echo "$VALID_CHANGED_IPYNB" | wc -l | tr -d ' ')
          # 兜底：空值设为0
          if ! [[ "$PY_FILE_COUNT" =~ ^[0-9]+$ ]]; then PY_FILE_COUNT=0; fi
          if ! [[ "$IPYNB_FILE_COUNT" =~ ^[0-9]+$ ]]; then IPYNB_FILE_COUNT=0; fi

          # 写入环境变量
          echo "VALID_CHANGED_PY<<EOF" >> "$GITHUB_ENV"
          echo "$VALID_CHANGED_PY" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          echo "VALID_CHANGED_IPYNB<<EOF" >> "$GITHUB_ENV"
          echo "$VALID_CHANGED_IPYNB" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          echo "PY_FILES_ARGS=$PY_FILES_ARGS" >> "$GITHUB_ENV"
          echo "PY_FILE_COUNT=$PY_FILE_COUNT" >> "$GITHUB_ENV"
          echo "IPYNB_FILES_ARGS=$IPYNB_FILES_ARGS" >> "$GITHUB_ENV"
          echo "IPYNB_FILE_COUNT=$IPYNB_FILE_COUNT" >> "$GITHUB_ENV"

          # 6. 打印结果（和markdownlint的输出格式对齐）
          echo "======================================"
          echo "===== Changed Files Summary ====="
          echo "✅  Changed .py files (to lint):"
          [ -z "$VALID_CHANGED_PY" ] && echo "  - None" || echo "$VALID_CHANGED_PY" | while IFS= read -r f; do echo "  - $f"; done
          echo "✅  Changed .ipynb files (to lint):"
          [ -z "$VALID_CHANGED_IPYNB" ] && echo "  - None" || echo "$VALID_CHANGED_IPYNB" | while IFS= read -r f; do echo "  - $f"; done
          echo "======================================"
        shell: bash

      - name: Run Pylint for .py files
        if: ${{ env.PY_FILE_COUNT > 0 }}
        run: |
          NUM_CORES=$(nproc)
          echo "🔧 Running Pylint on modified .py files..."

          PY_FILES=(
            ${{ env.PY_FILES_ARGS }}
          )
          
          # 执行 Pylint
          pylint "${PY_FILES[@]}" --jobs=$NUM_CORES --rcfile=.github/pylint.conf 2>&1 | tee pylint_py_logs.txt

          # 捕获 Pylint 的真实退出码（PIPESTATUS[0] 获取管道第一个命令的退出码）
          PYLINT_EXIT_CODE=${PIPESTATUS[0]}

          # 保存状态到文件（而不是环境变量），避免步骤间干扰
          echo "$PYLINT_EXIT_CODE" > pylint_py_exit_code.txt

          # 根据真实退出码判断结果
          if [ $PYLINT_EXIT_CODE -eq 0 ]; then
            echo "✅ .py files Pylint check passed"
          else
            echo "❌ .py files Pylint check failed, see details in pylint_py_logs.txt"
          fi
        shell: bash
        continue-on-error: true  # 允许这一步失败但不影响后续步骤

      - name: Set Pylint .py Status
        if: ${{ env.PY_FILE_COUNT > 0 }}
        run: |
          if [ -f pylint_py_exit_code.txt ] && [ "$(cat pylint_py_exit_code.txt)" = "0" ]; then
            echo "PYLINT_PY_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "PYLINT_PY_STATUS=failed" >> "$GITHUB_ENV"
          fi
        shell: bash


      - name: Skip Pylint for .py (no files)
        if: ${{ env.PY_FILE_COUNT == 0 }}
        run: |
          echo "✅ No modified .py files found, skipping Pylint for .py"
          echo "PYLINT_PY_STATUS=skipped" >> "$GITHUB_ENV"


      - name: Run Pylint for .ipynb files (via nbqa)
        if: ${{ env.IPYNB_FILE_COUNT > 0 }}
        run: |
          NUM_CORES=$(nproc)
          echo "🔧 Running Pylint on modified .ipynb files..."

          IPYNB_FILES=(
            ${{ env.IPYNB_FILES_ARGS }}
          )
          nbqa pylint "${IPYNB_FILES[@]}" --jobs=$NUM_CORES --rcfile=.github/pylint.conf  2>&1 | tee pylint_ipynb_logs.txt

          # 捕获退出码（注意：nbqa 的退出码可能不同于 pylint）
          NBQA_EXIT_CODE=${PIPESTATUS[0]}
          
          # 保存状态
          echo "$NBQA_EXIT_CODE" > pylint_ipynb_exit_code.txt

          if [ $NBQA_EXIT_CODE -eq 0 ]; then
            echo "✅ .ipynb files Pylint check passed"
          else
            echo "❌ .ipynb files Pylint check failed, see details in pylint_ipynb_logs.txt"
          fi
        shell: bash
        continue-on-error: true  # 允许这一步失败但不影响后续步骤

      - name: Set Pylint .ipynb Status
        if: ${{ env.IPYNB_FILE_COUNT > 0 }}
        run: |
          if [ -f pylint_ipynb_exit_code.txt ] && [ "$(cat pylint_ipynb_exit_code.txt)" = "0" ]; then
            echo "PYLINT_IPYNB_STATUS=success" >> "$GITHUB_ENV"
          else
            echo "PYLINT_IPYNB_STATUS=failed" >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Skip Pylint for .ipynb (no files)
        if: ${{ env.IPYNB_FILE_COUNT == 0 }}
        run: |
          echo "✅ No modified .ipynb files found, skipping Pylint for .ipynb"
          echo "PYLINT_IPYNB_STATUS=skipped" >> "$GITHUB_ENV"

      - name: Summarize Pylint Check Results
        run: |
          echo "===== Pylint Check Summary ====="
          echo ".py files status: ${{ env.PYLINT_PY_STATUS }}"
          echo ".ipynb files status: ${{ env.PYLINT_IPYNB_STATUS }}"
          echo "================================="

          if [ "${{ env.PYLINT_PY_STATUS }}" = "failed" ] || [ "${{ env.PYLINT_IPYNB_STATUS }}" = "failed" ]; then
            echo "❌ Pylint check has failed items, CI terminated."
            exit 1
          fi
        shell: bash

  markdownlint-check:
      name: Markdownlint Check
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pull-requests: write  # Required for assign reviewers and comments

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
          with:
            fetch-depth: 1

        - name: Generate GitHub App token
          id: generate-token
          uses: actions/create-github-app-token@v1
          with:
            app-id: ${{ secrets.APP_ID }}
            private-key: ${{ secrets.APP_PRIVATE_KEY }}
            
        - name: Get PR changed .ipynb and .md files
          id: get_pr_changed_files
          if: ${{ github.event_name == 'pull_request' }}
          run: |
            # 1. 仅安装必需依赖：jq（解析 API 返回的 JSON）
            if ! command -v jq &> /dev/null; then
              sudo apt update && sudo apt install jq -y
            fi
            # 2. 直接获取 GitHub App Token
            APP_TOKEN="${{ steps.generate-token.outputs.token }}"
            
            # 2. 核心：调用 GitHub API 获取 PR 改动文件（仅新增/修改，排除删除）
            # 定义curl参数数组
            CURL_ARGS=(
              -s
              -H "Authorization: Bearer $APP_TOKEN"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28"
              "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
            )
            
            # 执行curl
            ALL_CHANGED_FILES=$(curl "${CURL_ARGS[@]}" | jq -r '.[] | select(.status != "removed") | .filename')

            # 4. 筛选：改动的 .ipynb 和 .md 文件（仅保留存在且非空的）
            VALID_CHANGED_IPYNB=""
            VALID_CHANGED_MD=""

            while IFS= read -r file; do
              # 跳过已删除或空文件（双重保障）
              if [ ! -f "$file" ] || [ ! -s "$file" ]; then
                continue
              fi

              # 分类筛选 .ipynb 和 .md
              if [[ "$file" =~ \.ipynb$ ]]; then
                VALID_CHANGED_IPYNB+="$file"$'\n'
              elif [[ "$file" =~ \.md$ ]]; then
                VALID_CHANGED_MD+="$file"$'\n'
              fi
            done <<< "$ALL_CHANGED_FILES"

            # 去除末尾空行，导出为环境变量（供后续步骤使用）
            VALID_CHANGED_IPYNB=$(echo "$VALID_CHANGED_IPYNB" | sed '/^$/d')
            VALID_CHANGED_MD=$(echo "$VALID_CHANGED_MD" | sed '/^$/d')

            echo "VALID_CHANGED_IPYNB<<EOF" >> "$GITHUB_ENV"
            echo "$VALID_CHANGED_IPYNB" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"

            echo "VALID_CHANGED_MD<<EOF" >> "$GITHUB_ENV"
            echo "$VALID_CHANGED_MD" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"

            # 打印结果
            echo "======================================"
            echo "===== PR Changed Files Summary ====="
            echo "✅  Changed .ipynb files (to extract):"
            [ -z "$VALID_CHANGED_IPYNB" ] && echo "  - None" || echo "$VALID_CHANGED_IPYNB" | while IFS= read -r f; do echo "  - $f"; done
            echo "✅  Changed .md files (to lint directly):"
            [ -z "$VALID_CHANGED_MD" ] && echo "  - None" || echo "$VALID_CHANGED_MD" | while IFS= read -r f; do echo "  - $f"; done
            echo "======================================"

        - name: Extract Markdown from PR changed .ipynb files
          id: extract_md
          run: |
            set +e +u +o pipefail
            # 开启错误追踪（便于定位哪一行报错）
            # set -x

            export LC_ALL=en_US.UTF-8
            export LANG=en_US.UTF-8

            # 核心配置（导出为环境变量，避免未定义）
            TARGET_DIR="./temp_md"
            MAP_FILE="./md_ipynb_mapping.log"
            ERROR_LOG="./extract_error.log"
            # 确保变量导出，避免后续步骤引用未定义
            echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
            echo "MAP_FILE=$MAP_FILE" >> "$GITHUB_ENV"

            # 初始化目录和文件
            mkdir -p "$TARGET_DIR" || { echo "⚠️ Failed to create $TARGET_DIR, exit"; exit 0; }
            rm -rf "$TARGET_DIR"/* || true
            rm -f "$MAP_FILE" jq_batch_error.log temp_extract.tmp || true
            rm -f "$MAP_FILE" "$ERROR_LOG" || true

            # 无改动 .ipynb 则直接退出
            if [ -z "${{ env.VALID_CHANGED_IPYNB }}" ]; then
              echo "ℹ️  No changed .ipynb files to process, skipping extraction"
              exit 0
            fi

            # 遍历 PR 改动的 .ipynb 文件
            while IFS= read -r nb_file; do
              # 基础校验（CI 环境增强容错）
              if [ -z "$nb_file" ] || [ ! -f "$nb_file" ] || [ ! -s "$nb_file" ]; then
                echo "ℹ️  Skip invalid/empty file: $nb_file" >> "$ERROR_LOG"
                continue
              fi

              # 用 jq . 快速校验 JSON 是否可解析，静默执行
              if ! jq . "$nb_file" > /dev/null 2>&1; then
                error_msg="JSON parse failed (corrupted file)"
                echo "❌ Skip $nb_file: $error_msg"
                echo "ERROR: $nb_file - $error_msg" >> "$ERROR_LOG"
                continue
              fi

              # 生成目标 MD 路径
              nb_relpath="${nb_file#./}"
              md_file="$TARGET_DIR/${nb_relpath%.ipynb}.md"
              mkdir -p "$(dirname "$md_file")" || { echo "⚠️ Skip create dir for $md_file"; continue; }
              > "$md_file"

              # JQ 提取并保存退出码（带 cell 索引标记）
              markdown_content=$(jq -r '
                try (
                  .cells | to_entries[] |
                  select(.value.cell_type == "markdown") |
                  "<!-- CELL_IDX: \(.key) -->\n" +
                  (.value.source | if type == "array" then join("") else tostring end)
                ) catch ""
              ' "$nb_file" 2>> "$ERROR_LOG")
              jq_exit_code=$?

              # 如果 JQ 执行失败，跳过该文件
              if [ $jq_exit_code -ne 0 ]; then
                error_msg="JQ extraction failed (exit code: $jq_exit_code)"
                echo "❌ Skip $nb_file: $error_msg"
                echo "ERROR: $nb_file - $error_msg" >> "$ERROR_LOG"
                rm -f "$md_file"  # 清理空文件
                continue
              fi

              # 无内容则跳过
              if [ -z "$markdown_content" ]; then
                echo "ℹ️ No markdown content: $nb_file" >> "$ERROR_LOG"
                rm -f "$md_file"
                continue
              fi

              # 写入 MD 文件
              echo "$markdown_content" > "$md_file"
              sync "$md_file" || true

              # 生成映射表
              md_line=0
              cell_idx=0  # 默认值
              while IFS= read -r line; do
                md_line=$((md_line + 1))

                # 解析 cell 索引标记
                if echo "$line" | grep -q '<!-- CELL_IDX: [0-9]\+ -->'; then
                  cell_idx=$(echo "$line" | cut -d ':' -f 2 | cut -d ' ' -f 2)
                  continue
                fi

                # 写入映射表
                echo "$nb_file,$cell_idx,$md_file,$md_line" >> "$MAP_FILE" || true
              done < "$md_file"

              echo "✅ Extracted: $nb_file → $md_file"
            done <<< "$VALID_CHANGED_IPYNB"

            # 关闭错误追踪，打印提取日志
            # set +x
            echo -e "\n======================================"
            echo "===== Extraction Logs ======"
            if [ -s "$ERROR_LOG" ]; then
              echo "❌ Skipped files (errors):"
              cat "$ERROR_LOG" | sort | uniq
            else
              echo "✅ No extraction errors"
            fi
            # 安全获取映射表行数
            map_line_count=0
            if [ -f "$MAP_FILE" ]; then
              map_line_count=$(wc -l < "$MAP_FILE" 2>/dev/null || echo 0)
            fi
            echo "✅ Mapping file: $MAP_FILE (lines: $map_line_count)"
            echo "======================================"

        - name: Run markdownlint (full IPYNB error tracing)
          if: ${{ env.VALID_CHANGED_IPYNB != '' || env.VALID_CHANGED_MD != '' }}
          run: |
            set +e
            export PYTHONUNBUFFERED=1
            export NODE_UNBUFFERED=1

            # 1. 安装工具
            npm install -g markdownlint-cli@0.39.0

            # 2. 构建路径
            LINT_GLOBS=""
            MAP_FILE="./md_ipynb_mapping.log"

            if [ -n "${{ env.VALID_CHANGED_MD }}" ]; then
              RAW_MD_GLOBS=$(echo "${{ env.VALID_CHANGED_MD }}" | tr '\n' ' ' | sed 's/ $//')
              LINT_GLOBS+="$RAW_MD_GLOBS "
            fi
            if [ -n "${{ env.VALID_CHANGED_IPYNB }}" ]; then
              LINT_GLOBS+="temp_md/**/*.md"
            fi
            LINT_GLOBS=$(echo "$LINT_GLOBS" | sed 's/ $//')

            # 3. 打印路径
            echo -e "\n===== Markdownlint Check Paths ====="
            echo "$LINT_GLOBS" | tr ' ' '\n' | while IFS= read -r path; do
              [ -n "$path" ] && echo "  - $path"
            done
            echo "======================================"

            # 4. 捕获原始输出
            markdownlint $LINT_GLOBS --config .github/.markdownlint.json > markdownlint_force.log 2>&1
            LINT_EXIT_CODE=$?

            # 5. 错误溯源到IPYNB（兼容所有错误格式）
            if [ $LINT_EXIT_CODE -ne 0 ]; then
              echo -e "\n===== Markdownlint Errors (Traced to IPYNB) ====="

              # 读取所有错误行（过滤掉空行和日志分隔符）
              cat markdownlint_force.log | grep -v "^$" | grep -v "=====" | while IFS= read -r err_line; do
                # 跳过非错误行（如npm日志、空行）
                if ! [[ "$err_line" =~ ^[^:]+:[0-9]+ ]]; then
                  continue
                fi

                # 核心：兼容所有错误格式，提取文件和行号
                ERR_BASE=$(echo "$err_line" | cut -d' ' -f1)  # 提取 file:line[:col] 部分
                ERR_MSG=$(echo "$err_line" | cut -d' ' -f2-)   # 提取错误信息部分

                # 循环去掉最后一个":"及后面的数字，直到拿到纯文件路径
                MD_FILE="$ERR_BASE"
                while [[ "$MD_FILE" =~ :[0-9]+$ ]]; do
                  MD_FILE=$(echo "$MD_FILE" | rev | cut -d':' -f2- | rev)
                done
                # 提取行号：取最后一个":"后的数字（兼容 行号/行号:列号 两种格式）
                MD_LINE=$(echo "$ERR_BASE" | rev | cut -d':' -f1 | rev)
                # 额外：如果行号不是纯数字（比如带列号），再切一次
                if [[ "$MD_LINE" =~ :[0-9]+$ ]]; then
                  MD_LINE=$(echo "$MD_LINE" | cut -d':' -f1)
                fi

                # 过滤无效行号（非数字）
                if ! [[ "$MD_LINE" =~ ^[0-9]+$ ]]; then
                  continue
                fi

                # 转换为相对路径（匹配映射表）
                if command -v realpath >/dev/null 2>&1; then
                  MD_FILE_REL=$(realpath --relative-to=. "$MD_FILE" 2>/dev/null || echo "$MD_FILE")
                else
                  MD_FILE_REL="$MD_FILE"
                fi

                # 溯源到IPYNB（优先匹配+近似cell匹配+兜底）
                IPYNB_FOUND="false"
                if [ -f "$MAP_FILE" ]; then
                  # 1. 先找到该 MD 文件的所有映射记录
                  ALL_MAPPINGS=$(grep -F "$MD_FILE_REL" "$MAP_FILE")
                  if [ -n "$ALL_MAPPINGS" ]; then
                    # 2. 遍历所有映射，找到「错误行号 ≤ 当前行号」的最大 cell 起始行
                    MATCHED_MAPPING=""
                    MAX_MAPPED_LINE=0
                    while IFS= read -r mapping_line; do
                      MAP_IPYNB=$(echo "$mapping_line" | cut -d',' -f1)
                      MAP_CELL=$(echo "$mapping_line" | cut -d',' -f2)
                      MAP_MD_LINE=$(echo "$mapping_line" | cut -d',' -f4)

                      # 只比较数字行号
                      if [[ "$MAP_MD_LINE" =~ ^[0-9]+$ ]] && [ "$MAP_MD_LINE" -le "$MD_LINE" ] && [ "$MAP_MD_LINE" -gt "$MAX_MAPPED_LINE" ]; then
                        MAX_MAPPED_LINE="$MAP_MD_LINE"
                        MATCHED_MAPPING="$mapping_line"
                      fi
                    done <<< "$ALL_MAPPINGS"

                    # 3. 兜底逻辑：如果没匹配到，找最小的映射行
                    FALLBACK_MAPPING=""
                    MIN_MAPPED_LINE=999999
                    if [ -z "$MATCHED_MAPPING" ] && [ -n "$ALL_MAPPINGS" ]; then
                      while IFS= read -r mapping_line; do
                        MAP_MD_LINE=$(echo "$mapping_line" | cut -d',' -f4)
                        if [[ "$MAP_MD_LINE" =~ ^[0-9]+$ ]] && [ "$MAP_MD_LINE" -lt "$MIN_MAPPED_LINE" ]; then
                          MIN_MAPPED_LINE="$MAP_MD_LINE"
                          FALLBACK_MAPPING="$mapping_line"
                        fi
                      done <<< "$ALL_MAPPINGS"
                    fi

                    # 4. 优先处理正常匹配（最大行）
                    if [ -n "$MATCHED_MAPPING" ]; then
                      IPYNB_FILE=$(echo "$MATCHED_MAPPING" | cut -d',' -f1)
                      CELL_IDX=$(echo "$MATCHED_MAPPING" | cut -d',' -f2)
                      echo -e "❌ Error in ORIGINAL IPYNB (cell approximate):"
                      echo -e "  IPYNB File: $IPYNB_FILE (cell: $CELL_IDX)"
                      echo -e "  Temp MD File: $MD_FILE_REL (line: $MD_LINE, in cell $CELL_IDX)"
                      echo -e "  Error: $ERR_MSG"
                      IPYNB_FOUND="true"

                    # 5. 再处理兜底匹配（最小行）
                    elif [ -n "$FALLBACK_MAPPING" ]; then
                      IPYNB_FILE=$(echo "$FALLBACK_MAPPING" | cut -d',' -f1)
                      CELL_IDX=$(echo "$FALLBACK_MAPPING" | cut -d',' -f2)
                      echo -e "❌ Error in ORIGINAL IPYNB (min line fallback):"
                      echo -e "  IPYNB File: $IPYNB_FILE (cell: $CELL_IDX)"
                      echo -e "  Temp MD File: $MD_FILE_REL (line: $MD_LINE, fallback to min mapped line $MIN_MAPPED_LINE)"
                      echo -e "  Error: $ERR_MSG"
                      IPYNB_FOUND="true"
                    fi
                  fi
                else
                  echo -e "⚠️  Mapping file $MAP_FILE not found! Skip IPYNB tracing."
                fi

                # 如果没匹配到IPYNB，打印原生MD错误
                if [ "$IPYNB_FOUND" = "false" ]; then
                  # 区分原生MD和提取的MD
                  if [[ "$MD_FILE_REL" == temp_md/* ]]; then
                    echo -e "❌ Error in Extracted MD File (no IPYNB mapping):"
                    echo -e "  MD File: $MD_FILE_REL (line: $MD_LINE)"
                    echo -e "  Error: $ERR_MSG"
                    echo -e "  Hint: IPYNB mapping file is not available in CI action. Check the original IPYNB file corresponding to this MD file (path: ${MD_FILE_REL/temp_md\//})."
                  else
                    echo -e "❌ Error in Native MD File:"
                    echo -e "  File: $MD_FILE_REL (line: $MD_LINE)"
                    echo -e "  Error: $ERR_MSG"
                  fi
                fi
                echo -e "--------------------------------------"
              done

              exit $LINT_EXIT_CODE
            else
              echo -e "\n✅ All files passed markdownlint check!"
              exit 0
            fi
          shell: bash
          continue-on-error: false

        - name: Skip Markdownlint (no files)
          if: ${{ env.VALID_CHANGED_IPYNB == '' && env.VALID_CHANGED_MD == '' }}
          run: |
            echo "✅ No changed MD/IPYNB files, skipping markdownlint"

        - name: Clean up temporary files
          if: ${{ always() }}
          run: |
            rm -rf temp_md
            rm -f md_ipynb_mapping.log jq_batch_error.log markdownlint_error.log temp_extract.tmp
