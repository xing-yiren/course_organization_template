name: Auto Assign Reviewers

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  get-reviewers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for assign reviewers and comments
    env:
      # 提前定义环境变量，避免直接在 JS 中渲染复杂变量
      CODEOWNERS_PATH: ".github/CODEOWNERS"
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parse CODEOWNERS to find reviewers (output as string only)
        id: codeowners-parser
        run: |
          # Step 1: Check if CODEOWNERS exists
          if [ ! -f "$CODEOWNERS_PATH" ]; then
            echo "CODEOWNERS file not found, skipping all reviewer logic"
            echo "has_committers_str=false" >> $GITHUB_OUTPUT
            echo "all_committers_str=" >> $GITHUB_OUTPUT
            echo "committer_count_str=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Step 2: Extract valid committers (filter empty values strictly)
          ALL_COMMITTERS=$(grep -o '@[a-zA-Z0-9_-]*' "$CODEOWNERS_PATH" | \
            sed 's/^@//' | \
            sort | \
            uniq | \
            grep -v '^$' | \
            tr '\n' ' ')

          # Step 3: Clean up committer string (remove extra spaces)
          ALL_COMMITTERS=$(echo "$ALL_COMMITTERS" | sed 's/^[ \t]*//;s/[ \t]*$//;s/[ \t]+/ /g')

          # Step 4: Count valid committers
          COMMITTER_COUNT=0
          if [ -n "$ALL_COMMITTERS" ]; then
            COMMITTER_COUNT=$(echo "$ALL_COMMITTERS" | wc -w | tr -d ' ')
          fi

          # Step 5: Output ALL as STRING (critical: no direct JS format, avoid rendering errors)
          echo "has_committers_str=$(if [ $COMMITTER_COUNT -gt 0 ]; then echo "true"; else echo "false"; fi)" >> $GITHUB_OUTPUT
          echo "all_committers_str=$ALL_COMMITTERS" >> $GITHUB_OUTPUT
          echo "committer_count_str=$COMMITTER_COUNT" >> $GITHUB_OUTPUT

          # Log for verification
          echo "===== Shell Step Output (String Only) ====="
          echo "has_committers_str: $(if [ $COMMITTER_COUNT -gt 0 ]; then echo "true"; else echo "false"; fi)"
          echo "all_committers_str: $ALL_COMMITTERS"
          echo "committer_count_str: $COMMITTER_COUNT"
          echo "==========================================="

      - name: Tiered logic for assigning reviewers and commenting
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          # 关键：将所有步骤输出作为环境变量传递，而非直接注入 JS 脚本
          env:
            HAS_COMMITTERS_STR: ${{ steps.codeowners-parser.outputs.has_committers_str }}
            ALL_COMMITTERS_STR: ${{ steps.codeowners-parser.outputs.all_committers_str }}
            COMMITTER_COUNT_STR: ${{ steps.codeowners-parser.outputs.committer_count_str }}
          script: |
            // ==================== 核心：手动解析环境变量为合法 JS 格式（杜绝语法错误） ====================
            console.log("===== Env Var Parsing (For Syntax Safety) =====");
            // 1. Parse boolean (safe, no direct injection)
            const hasCommitters = process.env.HAS_COMMITTERS_STR === "true";
            // 2. Parse array (from space-separated string, filter empty values strictly)
            const allCommittersStr = process.env.ALL_COMMITTERS_STR || "";
            const allCommitters = allCommittersStr.split(' ').filter(committer => committer.trim() !== '');
            // 3. Parse number (safe, no NaN)
            const committerCount = parseInt(process.env.COMMITTER_COUNT_STR || "0", 10) || 0;
            // 4. Other safe variables (no injection)
            const prAuthor = context.actor;
            const prNumber = context.issue.number;
            const repoInfo = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            };

            // Log parsed results (verify no syntax errors)
            console.log("prAuthor:", prAuthor);
            console.log("hasCommitters:", hasCommitters);
            console.log("allCommitters (parsed):", allCommitters);
            console.log("committerCount (parsed):", committerCount);
            console.log("=============================================");

            // ==================== 跳过逻辑（无有效 committer） ====================
            if (!hasCommitters || allCommitters.length === 0 || committerCount === 0) {
              console.log("No valid committers found in CODEOWNERS, exiting process.");
              return;
            }

            // ==================== 三种场景逻辑（精准无误差） ====================
            const isAuthorCommitter = allCommitters.includes(prAuthor);
            const otherCommitters = allCommitters.filter(committer => committer !== prAuthor);
            const isOnlyAuthorCommitter = isAuthorCommitter && allCommitters.length === 1;

            // Scenario 1: PR author is NOT a committer
            if (!isAuthorCommitter) {
              console.log(`Scenario 1: PR author (${prAuthor}) is not a repo committer, assigning all committers.`);
              try {
                await github.rest.pulls.requestReviewers({
                  ...repoInfo,
                  reviewers: allCommitters
                });

                const reviewerMentions = allCommitters.map(c => `@${c}`).join(' ');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `🔔 This PR needs your review: ${reviewerMentions}\nPlease review the code changes at your earliest convenience, and feel free to invite another committer to review as well.`
                });
                console.log("Successfully assigned all committers and posted reminder comment.");
              } catch (error) {
                console.error("Error in Scenario 1 (assign all committers):", error.message);
                core.error(`Failed to execute Scenario 1 logic: ${error.message}`);
              }
            }
            // Scenario 2: PR author is a committer with other valid committers
            else if (isAuthorCommitter && !isOnlyAuthorCommitter && otherCommitters.length > 0) {
              console.log(`Scenario 2: PR author (${prAuthor}) is a committer, assigning other ${otherCommitters.length} committers.`);
              try {
                await github.rest.pulls.requestReviewers({
                  ...repoInfo,
                  reviewers: otherCommitters
                });

                const otherReviewerMentions = otherCommitters.map(c => `@${c}`).join(' ');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `🔔 This PR needs your review: ${otherReviewerMentions}\nPR author (@${prAuthor}) is a repo committer and has been excluded from automatic assignment. Please review the code changes at your earliest convenience.`
                });
                console.log("Successfully assigned other committers and posted reminder comment.");
              } catch (error) {
                console.error("Error in Scenario 2 (assign other committers):", error.message);
                core.error(`Failed to execute Scenario 2 logic: ${error.message}`);
              }
            }
            // Scenario 3: PR author is the ONLY valid committer (no more misjudgment)
            else if (isOnlyAuthorCommitter) {
              console.log(`Scenario 3: PR author (${prAuthor}) is the only repo committer, posting manual assignment reminder.`);
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `⚠️ Reminder for @${prAuthor}\nYou are the only repository committer, and PR author cannot review your own PR.\nPlease manually assign valid reviewers to complete the review process.`
                });
                console.log("Successfully posted manual assignment reminder to PR author.");
              } catch (error) {
                console.error("Error in Scenario 3 (remind manual assignment):", error.message);
                core.error(`Failed to execute Scenario 3 logic: ${error.message}`);
              }
            }